  <div class="btns"><button class="btn full" id="rS">${r?"Salvar":"Criar lembrete"}</button><button class="btn ghost full" id="rG">${ic("calendar")} Também pôr no Google Agenda</button>${r?`<button class="btn danger full" id="rX">Apagar lembrete</button>`:""}</div>`,s=>{
  s.querySelector("#rS").onclick=()=>{const o=readFields(RMF,s);if(!o.t)return toast("triangle-alert","Escreva do que lembrar","");o.d=o.d||TODAY();o.h=o.h||"09:00";const d=r||{id:"rem_"+nid(),c:"rem"};Object.assign(d,o);d.fired="";d.feito=false;save(d);closeSheet();rr();toast("alarm-clock","Lembrete criado",whenTxt(nextOcc(d,new Date())));if(!notifOK())enableNotif();};
  s.querySelector("#rG").onclick=()=>{const o=readFields(RMF,s);window.open(gcalURL(o.t||"Lembrete",o.d,o.h,o.rep,o.nota),"_blank","noopener");};
  const x=s.querySelector("#rX");if(x)x.onclick=()=>{removeDoc(r.id);closeSheet();rr();};});}

  r.feito=!r.feito;save(r);rr();if(r.feito)toast("check","Lembrete concluído",r.t);};

/* ================= MOTOR DE AVISOS ================= */
function tick(){if(!DB.be)return;const now=new Date(),t=TODAY(),hm=pad(now.getHours())+":"+pad(now.getMinutes());
  all("rem").forEach(r=>{if(r.feito)return;const o=lastOcc(r,now);if(!o)return;const key=iso(o)+" "+(r.h||"");if(r.fired===key)return;r.fired=key;save(r);if(now-o<12*36e5)notify("Lembrete: "+r.t,r.nota||whenTxt(o));});
  all("ev").forEach(e=>{if(!e.al||e.fired)return;const w=dtOf(e.d,e.h||"09:00");const at=new Date(w-(+e.al)*60000);if(now>=at&&now-at<12*36e5){e.fired=1;save(e);notify("Agenda: "+e.t,(e.h?e.h+" · ":"")+flong(e.d));}});
  all("ouv").forEach(a=>{if(a.fim||!a.lemb||!a.hora)return;if(hm>=a.hora&&!(a.log&&a.log[t])&&a.af!==t){a.af=t;save(a);notify("Hora do audiobook","Continue ouvindo: "+a.t);}});}
setInterval(()=>{try{tick();}catch(e){}},30000);

const evCol=k=>(EVC.find(x=>x[0]===k)||EVC[2])[2];
function dayItems(d){const ev=all("ev").filter(e=>e.d===d).sort((a,b)=>(a.h||"").localeCompare(b.h||""));const now=new Date();
  const rm=all("rem").filter(r=>!r.feito&&iso(nextOcc(r,now))===d);const tk=Object.keys(TRK).filter(k=>trkHas(k,d));const ct=all("conta").filter(c=>c.status!=="paga"&&c.venc===d);return{ev,rm,tk,ct};}
VIEWS.cal=()=>{const[y,m]=ym(),t=TODAY(),sel=VIEW.sel||t,flt=VIEW.flt||"";let h=`<header class="top"><span class="mb">${ic("calendar-days")}</span><h1>Calendário</h1><button class="ib" data-a="calToday" aria-label="Ir para hoje">${ic("sun-medium")}</button></header>`;
  h+=`<div class="tabs"><button data-a="calFlt" data-v="" aria-pressed="${!flt}">Tudo</button>${EVC.map(c=>`<button data-a="calFlt" data-v="${c[0]}" aria-pressed="${flt===c[0]}"><span class="sw" style="display:inline-block;background:${c[2]};margin-right:6px"></span>${c[1]}</button>`).join("")}</div>`;
  h+=calNav(y,m,"mNav")+monthGrid(y,m,(d,n)=>{const I=dayItems(d);let dots=I.ev.filter(e=>!flt||e.cat===flt).map(e=>evCol(e.cat));if(!flt){dots=dots.concat(I.ct.map(c=>c.tipo==="receber"?"#15803D":"#B91C1C"),I.rm.map(()=>"#F59E0B"),I.tk.map(k=>MODS[k].c1));}
    return `<button class="day ${d===sel?"sel":""} ${d===t?"td":""}" data-a="calSel" data-d="${d}" aria-label="${n}, ${dots.length} itens">${n}<span class="dots">${dots.slice(0,6).map(c=>`<i style="background:${c}"></i>`).join("")}</span></button>`;});
  const I=dayItems(sel);const fz=all("fiz").filter(f=>f.d===sel);const gs=sum(all("exp").filter(e=>e.d===sel).map(e=>e.v));
  h+=`<div class="sec"><h2>${esc(flong(sel))}</h2></div>`;
  const evs=I.ev.filter(e=>!flt||e.cat===flt);
  if(evs.length)h+=evs.map(e=>`<div class="item" style="border-left:5px solid ${evCol(e.cat)}"><button class="ibody" data-a="evEdit" data-id="${e.id}"><b>${esc(e.t)}</b><div class="meta">${e.h?`<span class="chip">${ic("clock")} ${esc(e.h)}</span>`:""}<span class="chip" style="color:${evCol(e.cat)}">${esc((EVC.find(x=>x[0]===e.cat)||EVC[2])[1])}</span>${e.local?`<span class="chip">${ic("map-pin")} ${esc(e.local)}</span>`:""}</div>${e.nota?`<p>${esc(e.nota)}</p>`:""}</button></div>`).join("");
  if(!flt){if(I.rm.length)h+=I.rm.map(remCard).join("");
    if(I.tk.length)h+=`<div class="wrap-row" style="margin:6px 0 10px">${I.tk.map(k=>`<button class="chip m" style="padding:7px 11px" data-a="go" data-v="${gv(MODS[k].v)}">${ic(MODS[k].ic)} ${esc(MODS[k].n)}</button>`).join("")}</div>`;
    if(I.ct.length)h+=I.ct.map(c=>`<div class="item" style="border-left:5px solid ${c.tipo==="receber"?"var(--ok)":"var(--no)"}"><button class="ibody" data-a="go" data-v="${gv({v:"contas",tab:c.tipo})}"><div class="row"><b class="grow ell">${c.tipo==="receber"?"A receber":"A pagar"}: ${esc(c.desc)}</b><span class="amt">${money(c.valor)}</span></div>${c.quem?`<div class="meta"><span class="chip">${esc(c.quem)}</span></div>`:""}</button></div>`).join("");
    if(fz.length)h+=`<div class="card small"><b>O que eu fiz</b><ul style="margin:6px 0 0;padding-left:18px">${fz.map(f=>`<li>${esc(f.t)}</li>`).join("")}</ul></div>`;
    if(gs)h+=`<div class="note">${ic("wallet")} Gastos do dia: <b>${money(gs)}</b></div>`;}
  if(!evs.length&&(flt||(!I.rm.length&&!I.tk.length&&!fz.length&&!I.ct.length)))h+=`<div class="note">Nada marcado neste dia. Toque no + para adicionar um compromisso${flt?"":" ou uma atividade acadêmica"}.</div>`;
  return `<div class="app">${h}</div>${fab("evNew","Novo compromisso")}`;};

/* ================= ESPAÇO DO FOTÓGRAFO ================= */
const folders=par=>all("fold").filter(f=>(f.par||"")===par).sort((a,b)=>(a.o||0)-(b.o||0));
const photosIn=fid=>all("ph").filter(p=>p.f===fid).sort((a,b)=>(a.at||0)-(b.at||0));
function descend(fid){let out=[fid];folders(fid).forEach(s=>{out=out.concat(descend(s.id));});return out;}
function coverOf(fid){for(const id of descend(fid)){const p=photosIn(id)[0];if(p)return p.img;}return null;}
function countIn(fid){return sum(descend(fid).map(id=>photosIn(id).length));}
function albCard(f,small){const cv=coverOf(f.id),n=countIn(f.id);return `<button class="alb" data-fid="${f.id}" data-a="go" data-v="${gv({v:"foto",f:f.id})}"><div class="cv">${cv?imgTag(cv,"t"):ic(small?"folder":"images")}</div><b>${esc(f.nome)}</b><span>${n} ${n===1?"foto":"fotos"}${folders(f.id).length?" · "+folders(f.id).length+" pastas":""}</span></button>`;}
VIEWS.foto=()=>{const fid=VIEW.f||"";if(!fid){const A=folders("");let h=topbar("Espaço do fotógrafo","foto");
    if(A.length>1)h+=`<div class="note">${ic("grip-vertical")} Segure um álbum e arraste para mudar a ordem.</div>`;h+=A.length?`<div class="albums" id="albs">${A.map(f=>albCard(f)).join("")}</div>`:empty("foto","Crie seu primeiro álbum","Ex.: JOCELIO E LINDA. Dentro dele, crie pastas como Making of, Noivo e Noiva.",`<button class="btn sm" data-a="fNew">${ic("folder-plus")} Criar álbum</button>`);
    after(()=>{const a=$("albs");if(a)enableFolderSort(a);});return `<div class="app">${h}</div>${fab("fNew","Novo álbum")}`;}
  const F=getD(fid);if(!F){VIEW={v:"foto",f:""};return VIEWS.foto();}
  const path=[];let p=F;while(p){path.unshift(p);p=p.par?getD(p.par):null;}
  const subs=folders(fid),ph=photosIn(fid);
  let h=topbar(F.nome,"foto",`<button class="ib" data-a="fMenu" aria-label="Opções da pasta">${ic("ellipsis-vertical")}</button>`);
  h+=(DB.be.kind==="firebase"?`<div class="row" style="margin:-2px 0 6px"><button class="chip ${F.off?"c":""}" style="padding:6px 12px" data-a="fOffline">${ic(F.off?"check":"download")} ${F.off?"Disponível offline · atualizar":"Salvar para ver offline"}</button></div>`:"")+`<div class="crumbs"><button data-a="tab" data-v="${gv({v:"foto",f:""})}">Álbuns</button>${path.map(x=>` ${ic("chevron-right")} ${x.id===fid?`<span>${esc(x.nome)}</span>`:`<button data-a="tab" data-v="${gv({v:"foto",f:x.id})}">${esc(x.nome)}</button>`}`).join("")}</div>`;
  h+=`<div class="sec" style="margin-top:8px"><h2>Pastas</h2><button class="lk" data-a="fNew">${ic("folder-plus")} Nova pasta</button></div>`;
  const sug=["Making of","Noivo","Noiva","Cerimônia","Festa","Família"].filter(n=>!subs.some(f=>f.nome.toLowerCase()===n.toLowerCase()));
  if(subs.length)h+=`<div class="subs" id="subs">${subs.map(f=>albCard(f,1)).join("")}</div>`;
  if(sug.length&&subs.length<6)h+=`<div class="wrap-row" style="margin-top:8px">${sug.map(n=>`<button class="chip m" style="padding:8px 12px" data-a="fSug" data-n="${n}">${ic("plus")} ${n}</button>`).join("")}</div>`;
  h+=`<div class="sec"><h2>Fotos</h2><span class="chip">${ph.length}</span>${ph.length?`<span class="zoomctl"><button class="ib" data-a="colsPlus" aria-label="Fotos menores">${ic("zoom-out")}</button><span id="colsLbl" class="small muted">${colsGet()} por linha</span><button class="ib" data-a="colsMinus" aria-label="Fotos maiores">${ic("zoom-in")}</button></span>`:""}</div>${ph.length?`<div class="tiny faint" style="margin:-4px 0 8px">No celular, use dois dedos sobre as fotos para aumentar ou diminuir.</div>`:""}`;
  h+=ph.length?`<div class="pgrid" id="pgrid" style="--cols:${colsGet()}">${ph.map((x,i)=>`<button data-a="phOpen" data-i="${i}" aria-label="Abrir foto ${i+1}">${imgTag(x.img,"t")}</button>`).join("")}</div>`:`<div class="note">Nenhuma foto nesta pasta. Toque no + para adicionar várias de uma vez.</div>`;
  after(()=>{const s=$("subs");if(s)enableFolderSort(s);const g=$("pgrid");if(g)enablePinch(g);});
  return `<div class="app">${h}</div><button class="fab" data-a="phAdd" aria-label="Adicionar fotos">${ic("image-plus")}</button>`;};

ACT.phAdd=async()=>{const fid=VIEW.f;const files=await pickFiles(true);if(!files.length)return;let ok=0;const bar=document.createElement("div");bar.className="toast";bar.innerHTML=`<span class="ti">${ic("image-plus")}</span><div><b>Enviando fotos</b><span id="upn">0 de ${files.length}</span></div>`;$("toasts").appendChild(bar);
  for(let i=0;i<files.length;i++){try{const p=await processImage(files[i]);const ref=await storeImage(p);save({id:"ph_"+nid(),c:"ph",f:fid,img:ref,at:Date.now()+i});ok++;}catch(e){}const u=$("upn");if(u)u.textContent=(i+1)+" de "+files.length;if(VIEW.v==="foto"&&VIEW.f===fid&&i%3===2)rr();}
  bar.remove();if(VIEW.v==="foto"&&VIEW.f===fid)rr();toast(ok===files.length?"check":"triangle-alert",ok+" "+(ok===1?"foto adicionada":"fotos adicionadas"),ok<files.length?(files.length-ok)+" não puderam ser enviadas":"");};

ACT.bkExp=async()=>{const data=JSON.stringify({app:"movingup",v:1,em:new Date().toISOString(),docs:[...DB.docs.values()]});const name="moving-up-"+TODAY()+".json";
  try{if(window.claude&&claude.use){const dl=await claude.use("downloads");if(dl){await dl.save({filename:name,data});return;}}}catch(e){if(e&&e.code)return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();};

  $("view").innerHTML=`<div class="app" style="max-width:460px;padding-top:7vh"><div style="text-align:center">${logo(84)}<div class="hello" style="margin-top:16px">Moving Up</div><p class="muted">Entre para guardar tudo na nuvem e ver seus dados em qualquer aparelho.</p></div>

const authMsg=e=>{const c=(e&&e.code)||"";return c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")?"E-mail ou senha incorretos.":c.includes("email-already-in-use")?"Este e-mail já tem conta. Use Entrar.":c.includes("weak-password")?"A senha precisa ter pelo menos 6 caracteres.":c.includes("invalid-email")?"Digite um e-mail válido.":c.includes("network")?"Sem internet. Conecte-se e tente de novo.":c.includes("too-many")?"Muitas tentativas. Espere alguns minutos.":c.includes("operation-not-allowed")?"Ative o login por e-mail/senha no Firebase (Authentication > Sign-in method).":"Não foi possível entrar ("+c+").";};

async function migrateLocal(){const docs=await localDocs();if(!docs.length)return toast("info","Nada para enviar","Não há dados guardados só neste aparelho.");
  const bar=document.createElement("div");bar.className="toast";bar.innerHTML=`<span class="ti">${ic("cloud-upload")}</span><div><b>Enviando para a nuvem</b><span id="mgn">0 de ${docs.length}</span></div>`;$("toasts").appendChild(bar);let n=0,fail=0;
  for(const d of docs){try{if(d.img&&d.img.s==="l"){const d2=await idb();const full=await idbReq(d2.transaction("imgs").objectStore("imgs").get(d.img.f));const th=await idbReq(d2.transaction("imgs").objectStore("imgs").get(d.img.t));
      if(full&&th)d.img=await FireImgs.put(full,th);else delete d.img;}
    if(!DB.docs.has(d.id)||(DB.docs.get(d.id).u||0)<(d.u||0)){DB.docs.set(d.id,d);await DB.be.put(d);}}catch(e){fail++;}n++;const m=$("mgn");if(m)m.textContent=n+" de "+docs.length;}
  bar.remove();localStorage.setItem("mu_migrado","1");rr();toast(fail?"triangle-alert":"check",fail?"Envio concluído com "+fail+" falhas":"Tudo enviado para a nuvem",(docs.length-fail)+" registros");}

async function bootFirebase(){
  try{await loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app-compat.js`);await Promise.all([loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth-compat.js`),loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore-compat.js`)]);}
  catch(e){hideSplash();$("main").classList.remove("hidden");$("view").innerHTML=`<div class="app" style="padding-top:12vh">${empty("home","Sem conexão","Na primeira vez, o app precisa de internet para entrar na sua conta. Conecte-se e toque em tentar de novo.",`<button class="btn" onclick="location.reload()">Tentar de novo</button>`)}</div>`;return;}
  firebase.initializeApp(FBCFG);const db=firebase.firestore();try{await db.enablePersistence({synchronizeTabs:true});}catch(e){}
  let started=false;
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){if(started)location.reload();else showLogin();return;}
    if(started)return;started=true;$("view").innerHTML=`<div class="splash" style="position:static;height:70vh"><div class="lg">${logo(80)}</div></div>`;
    try{const be=FireBackend(db,u.uid);const docs=await be.loadAll();startApp(be,docs);
      if(!docs.length&&!localStorage.getItem("mu_migrado")){const loc=await localDocs();if(loc.length)setTimeout(()=>ACT.migrar(),600);}}
    catch(e){started=false;showLogin(e&&e.code==="permission-denied"?"Sem permissão no banco. Confira as regras do Firestore (passo 5).":"Não foi possível carregar seus dados. Tente de novo.");}});}
async function boot(){
  if(FBCFG)return bootFirebase();
  let be=null,docs=[];
  try{if(window.claude&&typeof claude.use==="function"){const tm=new Promise(r=>setTimeout(()=>r(null),12000));
    const db=await Promise.race([claude.use("db"),tm]);const user=db?await Promise.race([claude.use("user"),tm]):null;const uid=user?await user.id():null;
    if(db&&uid){const assets=await Promise.race([claude.use("assets"),new Promise(r=>setTimeout(()=>r(null),4000))]);const cb=CloudBackend(db,uid,assets);docs=await cb.loadAll();be=cb;}}}
  catch(e){console.warn("nuvem indisponível",e);be=null;docs=[];}
  if(!be){try{be=LocalBackend();docs=await be.loadAll();}catch(e){be={kind:"mem",loadAll:async()=>[],put:async()=>{},del:async()=>{},imgs:{put:async(f,t)=>({s:"m",f:URL.createObjectURL(f),t:URL.createObjectURL(t)}),url:async k=>k,del:async()=>{}}};docs=[];toast("triangle-alert","O armazenamento está bloqueado","Os dados desta visita não serão guardados.");}}
  startApp(be,docs);
  let hid=0;document.addEventListener("visibilitychange",async()=>{if(document.hidden){hid=Date.now();return;}tick();
    if(DB.be.kind==="cloud"&&hid&&Date.now()-hid>60000&&$("sheet").classList.contains("hidden")&&!VW){try{const d=await DB.be.loadAll();DB.docs.clear();d.forEach(x=>DB.docs.set(x.id,x));rr();}catch(e){}}});}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&DB.be)tick();});

function colsGet(){try{return clamp(+localStorage.getItem("mu_cols")||3,2,5);}catch(e){return 3;}}
function colsSet(n){n=clamp(n,2,5);try{localStorage.setItem("mu_cols",String(n));}catch(e){}qa(".pgrid").forEach(g=>g.style.setProperty("--cols",n));const l=$("colsLbl");if(l)l.textContent=n+" por linha";}
ACT.colsMinus=()=>colsSet(colsGet()-1);ACT.colsPlus=()=>colsSet(colsGet()+1);
function enablePinch(g){const pts=new Map();let base=0,acc=0;
  const dist=()=>{const [a,b]=[...pts.values()];return Math.hypot(a[0]-b[0],a[1]-b[1]);};
  g.addEventListener("pointerdown",e=>{if(e.pointerType!=="touch")return;pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){base=dist();dragMark();}});
  g.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2&&base){const d=dist(),r=d/base;if(r>1.22){colsSet(colsGet()-1);base=d;}else if(r<0.82){colsSet(colsGet()+1);base=d;}dragMark();}});
  const up=e=>{if(pts.delete(e.pointerId)&&base)dragMark();if(pts.size<2)base=0;};
  ["pointerup","pointercancel","pointerleave"].forEach(t=>g.addEventListener(t,up));
  g.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();acc+=e.deltaY;if(acc>50){colsSet(colsGet()+1);acc=0;}else if(acc<-50){colsSet(colsGet()-1);acc=0;}},{passive:false});}


/* ================= COLAR LISTA DE GASTOS ================= */
const normTxt=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
const G_CAT_RULES=[
  ["Esportes",["natacao","sunga","palmar","touca","oculos de natacao","joelho","cdo","capoeira","academia","tripe","treino","corrida","tenis de corrida"]],
  ["Alimentação",["almoco","jantar","lanche","pizza","ru","restaurante","churrasco","cafe","acai","hamburguer","ifood","sorvete","padaria"]],
  ["Mercado",["supermercado","mercado","feira","atacadao"]],
  ["Transporte",["uber","99","gasolina","combustivel","pneu","onibus","passagem","estacionamento","oficina","moto","carro"]],
  ["Contas",["agua","luz","energia","internet","tim","claro","vivo","oi","telefone","celular"]],
  ["Moradia",["aluguel","condominio","gas"]],
  ["Saúde",["farmacia","remedio","consulta","exame","dentista","medico"]],
  ["Educação",["curso","livro","apostila","faculdade","mensalidade escola","concurso"]],
  ["Assinaturas",["capcut","captcut","netflix","spotify","prime","assinatura","youtube premium","icloud","google one"]],
  ["Lazer",["montanha russa","ingresso","cinema","avatar","show","parque","festa","carnaval","viagem","passeio","bar"]],
  ["Vestuário",["bermuda","blusa","camisa","calca","roupa","sapato","tenis","short","vestido"]],
  ["Cuidados pessoais",["perfume","cabelo","barbearia","corte","salao","cosmetico","creme"]],
  ["Doações",["oferta","dizimo","doacao"]],
];
function gCat(item){const t=" "+normTxt(item)+" ";for(const [c,ks] of G_CAT_RULES)if(ks.some(k=>t.includes(" "+k+" ")||(k.includes(" ")&&t.includes(k))))return c;return "Outros";}
const G_PAG_RULES=[["Dinheiro",/dinheiro( fisico)?|especie|cash/],["Débito",/debito/],["Cartão",/cartao|credito|card/],["Pix",/\bpix\b/],["Boleto",/boleto/]];
const G_FIX={"agua":"Água","ru":"RU","tim":"TIM","uber":"Uber","cdo":"CDO"};
function gNiceItem(s){s=s.replace(/\s+/g," ").trim();if(!s)return"";
  return s.split(" ").map((w,i)=>{const n=normTxt(w);if(G_FIX[n])return G_FIX[n];if(w.length>3&&w===w.toUpperCase()&&/[A-ZÀ-Ú]/.test(w))w=w.toLowerCase();return i===0?w.charAt(0).toUpperCase()+w.slice(1):w;}).join(" ");}
function gParseValue(s){s=s.replace(/\s/g,"");if(/,/.test(s))s=s.replace(/\./g,"").replace(",",".");else if(/\.\d{3}$/.test(s))s=s.replace(/\./g,"");const n=parseFloat(s);return isNaN(n)?null:Math.round(n*100)/100;}
function gParseList(txt){const rows=[],bad=[];let informed=null;
  txt.split(/\r?\n/).forEach(raw=>{let l=raw.trim();if(!l)return;
    const tm=l.match(/^total\s*[:\-]?\s*(?:r\$)?\s*([\d.,]+)/i);if(tm){informed=gParseValue(tm[1]);return;}
    const vm=l.match(/^(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/i);
    if(!vm){bad.push(raw);return;}const v=gParseValue(vm[1]);let rest=l.slice(vm[0].length).replace(/^\s*(reais|real|r\$)\b/i,"");
    let pag="";const nrest=normTxt(rest);for(const [p,re] of G_PAG_RULES){const mm=nrest.match(re);if(mm){pag=p;break;}}
    if(pag){const words=["dinheiro físico","dinheiro fisico","dinheiro","espécie","especie","cartão de crédito","cartao de credito","cartão","cartao","crédito","credito","débito","debito","pix","boleto"];
      for(const w of words){const re=new RegExp("(^|[\\s|\\-–—:/])"+w.replace(/ /g,"\\s+")+"(?=$|[\\s|\\-–—:/])","i");if(re.test(rest)){rest=rest.replace(re,"$1");break;}}}
    const item=gNiceItem(rest.split(/\s*[|–—]\s*|\s+-\s+|^\s*-\s*|\s*-\s*$/).map(x=>x.replace(/^[\s|\-–—:]+|[\s|\-–—:]+$/g,"")).filter(Boolean).join(" · "));
    if(v==null||v<=0){bad.push(raw);return;}
    rows.push({v,pag:pag||"Outro",desc:item||"Gasto",cat:gCat(item),inc:true});});
  return{rows,bad,informed};}

  const inn=$("sheet").querySelector(".in");if(inn)inn.scrollTop=y;}

function treinos(){let T=all("tr").sort((a,b)=>(a.o||0)-(b.o||0));if(!T.length){T=["A","B","C"].map((l,k)=>save({id:"tr_"+l,c:"tr",letra:l,nome:"",o:k*10,ex:[]}));}return T;}
const trcId=(tr,d)=>"tc_"+tr+"_"+d;
function trDone(tr,d){const x=getD(trcId(tr.id,d));return x?x.done.filter(id=>tr.ex.some(e=>e.id===id)):[];}
function trLast(tr){const L=all("trc").filter(x=>x.tr===tr.id&&tr.ex.length&&x.done.filter(id=>tr.ex.some(e=>e.id===id)).length>=tr.ex.length).map(x=>x.d).sort();return L[L.length-1]||"";}
function trSugerido(T){let best=null,bd="";T.forEach(t=>{const l=trLast(t);if(l>bd){bd=l;best=t;}});if(!best)return T[0];const i=T.indexOf(best);return T[(i+1)%T.length];}

  if(ab)h+=`<div class="sec"><h2>Audiobook em andamento</h2></div><div ${mstyle("audio")}>${ouvCard(ab)}</div>`;
  /* 7. Escada da semana */
  const days=[...Array(7)].map((_,i)=>addDays(t,i-6)),vals=days.map(activityOn),mx=Math.max(...vals,4),tot=sum(vals);
  h+=`<div class="sec"><h2>Sua subida na semana</h2></div><div class="stairs"><div class="row"><div class="big">${tot}</div><div class="small muted">checks nos últimos 7 dias<br>treinos, hábitos e tarefas feitas</div></div>
   <div class="bars">${days.map((d,i)=>`<div class="b ${vals[i]?"on":""} ${d===t?"td":""}"><em>${vals[i]||""}</em><i style="height:${Math.max(6,vals[i]/mx*100)}%"></i><span>${DSEM[pd(d).getDay()]}</span></div>`).join("")}</div></div>`;
  return `<div class="app">${h}<div class="foot">Moving Up · organização pessoal</div></div>`;};

/* ================= MIGRAÇÃO: Metas → Metas do ano (blocos) ================= */
function migrateData(){const MAP={"Saúde e corpo":"Físico","Finanças":"Financeiro","Carreira":"Profissional","Estudos":"Profissional","Cultura e arte":"Profissional","Relacionamento":"Relacionamento","Espiritualidade":"Espiritual"};
  all("metas").forEach(m=>{const n={...m,id:"ano_"+m.id.replace(/^metas_/,""),c:"ano",ano:String((m.prazo||"").slice(0,4)||yNow()),area:MAP[m.area]||m.area||"Físico"};save(n);removeDoc(m.id);});
  all("ano").forEach(a=>{if(MAP[a.area]&&MAP[a.area]!==a.area){a.area=MAP[a.area];save(a);}});}

/* ================= NOTAS DOS EDITAIS ================= */
function edNotas(ano){return all("edn").filter(n=>!ano||String(n.ano||"2026")===String(ano)).sort((a,b)=>(a.feito?1:0)-(b.feito?1:0)||(b.u||0)-(a.u||0));}
function edNotasCount(eid){return all("edn").filter(n=>n.ed===eid&&!n.feito).length;}
const EDN_SUG=["Fazer a prestação de contas","Falta documento:","Aguardando resultado","Assinar o termo","Enviar recurso até","Conferir pagamento"];
ACT.ednOpen=el=>{VIEW.ednEd=el&&el.dataset&&el.dataset.ed||"";ednRender();};
function ednRender(){const y=VIEW.ano||"2026",fe=VIEW.ednEd||"";const E=edsDoAno(y);const L=edNotas(y).filter(n=>!fe||n.ed===fe);const pend=L.filter(n=>!n.feito);
  sheet(`<h2>${ic("notebook-pen")} Notas dos editais ${esc(y)}</h2><p class="muted small">Pendências e lembretes de cada edital. Marque ✓ quando resolver.</p>
   <div class="tabs"><button data-a="ednF" data-ed="" aria-pressed="${!fe}">Todas</button>${E.map(e=>`<button data-a="ednF" data-ed="${e.id}" aria-pressed="${fe===e.id}">${esc(e.nome)}</button>`).join("")}</div>
   <label class="fld" style="margin-top:6px"><span>Nova nota</span><textarea id="ednT" style="min-height:70px" placeholder="Ex.: Falta enviar o relatório de execução"></textarea></label>
   <div class="wrap-row" style="margin:-4px 0 8px">${EDN_SUG.map(s=>`<button class="chip" style="padding:6px 10px" data-a="ednSug" data-t="${esc(s)}">${esc(s)}</button>`).join("")}</div>
   <div class="row"><select id="ednE" style="flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--sf)"><option value="">Geral (sem edital específico)</option>${E.map(e=>`<option value="${e.id}" ${fe===e.id?"selected":""}>${esc(e.nome)}</option>`).join("")}</select><button class="btn" data-a="ednAdd">${ic("plus")} Salvar</button></div>
   <div class="grp">Pendentes<span class="chip a">${pend.length}</span></div>
   ${L.length?L.map(n=>{const ed=n.ed?getD(n.ed):null;return `<div class="item"><button class="ck ${n.feito?"on":""}" data-a="ednT" data-id="${n.id}" aria-label="Resolvida">${ic("check")}</button><div class="ibody"><b class="${n.feito?"strike":""}" style="white-space:pre-wrap;font-weight:700">${esc(n.t)}</b><div class="meta">${ed?`<span class="chip m">${esc(ed.nome)}</span>`:`<span class="chip">Geral</span>`}<span class="chip">${new Date(n.cr||n.u||Date.now()).toLocaleDateString("pt-BR")}</span></div></div><button class="ib" style="width:32px;height:32px" data-a="ednX" data-id="${n.id}" aria-label="Apagar nota">${ic("trash-2")}</button></div>`;}).join(""):`<div class="note">Nenhuma nota ${fe?"neste edital":"ainda"}.</div>`}
   <div class="btns"><button class="btn ghost full" data-a="close">Fechar</button></div>`);}
ACT.ednF=el=>{VIEW.ednEd=el.dataset.ed;ednRender();};
ACT.ednSug=el=>{const t=$("ednT");t.value=(t.value?t.value+" ":"")+el.dataset.t+(el.dataset.t.endsWith(":")||el.dataset.t.endsWith("até")?" ":"");t.focus();};
ACT.ednAdd=()=>{const t=$("ednT").value.trim();if(!t)return $("ednT").focus();save({id:"edn_"+nid(),c:"edn",t,ed:$("ednE").value,ano:VIEW.ano||"2026",feito:false,cr:Date.now()});VIEW.ednEd=$("ednE").value||VIEW.ednEd;rr();ednRender();toast("notebook-pen","Nota salva","");};
ACT.ednT=el=>{const n=getD(el.dataset.id);n.feito=!n.feito;save(n);rr();ednRender();};
ACT.ednX=el=>{removeDoc(el.dataset.id);rr();ednRender();};

/* ================= FOTOS DISPONÍVEIS OFFLINE ================= */
ACT.fOffline=async()=>{const F=getD(VIEW.f);if(!F)return;if(DB.be.kind!=="firebase")return toast("check","Já disponível offline","As fotos ficam guardadas neste aparelho.");
  const ph=descend(F.id).flatMap(id=>photosIn(id));if(!ph.length)return toast("info","Nenhuma foto neste álbum","");
  const bar=document.createElement("div");bar.className="toast";bar.innerHTML=`<span class="ti">${ic("download")}</span><div><b>Salvando para ver offline</b><span id="ofn">0 de ${ph.length}</span></div>`;$("toasts").appendChild(bar);let ok=0;
  for(let i=0;i<ph.length;i++){try{await FireImgs.url(ph[i].img.t);if(!(await offHas(ph[i].img.f)))await FireImgs.url(ph[i].img.f);ok++;}catch(e){}const n=$("ofn");if(n)n.textContent=(i+1)+" de "+ph.length;}
  bar.remove();F.off=Date.now();save(F);rr();toast(ok===ph.length?"check":"triangle-alert",ok===ph.length?"Álbum disponível offline":"Algumas fotos não foram salvas",ok+" de "+ph.length+" fotos no aparelho");};

</script>
