<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moving Up</title>
<meta name="description" content="Moving Up: organização pessoal para elevar sua performance. Treinos, hábitos, metas, gastos, lembretes e muito mais em um só lugar.">
<meta name="theme-color" content="#F5F5F9">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="moving-up.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2218%22%20fill%3D%22%234F46E5%22/%3E%3Crect%20x%3D%2211%22%20y%3D%2244%22%20width%3D%229%22%20height%3D%229%22%20rx%3D%222.5%22%20fill%3D%22%23fff%22%20fill-opacity%3D%22.3%22/%3E%3Crect%20x%3D%2222%22%20y%3D%2238%22%20width%3D%229%22%20height%3D%2215%22%20rx%3D%222.5%22%20fill%3D%22%23fff%22%20fill-opacity%3D%22.3%22/%3E%3Crect%20x%3D%2233%22%20y%3D%2231%22%20width%3D%229%22%20height%3D%2222%22%20rx%3D%222.5%22%20fill%3D%22%23fff%22%20fill-opacity%3D%22.3%22/%3E%3Cpath%20d%3D%22M14%2040V22l11%2011%2011-11%2011-11%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M38%2011h10v10%22%20fill%3D%22none%22%20stroke%3D%22%23FCD34D%22%20stroke-width%3D%225.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="mu-apple-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Moving Up">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Moving Up · visual 3: cores sólidas, claras e com contraste ===== */
:root{
  --bg:#F5F5F9;--sf:#FFFFFF;--sf2:#F1F1F6;--sf3:#E6E6EE;--line:#E2E2EB;--ink:#16142E;--soft:#4A4764;--faint:#6F6C88;
  --brand:#4F46E5;--sun:#F59E0B;
  --ok:#15803D;--wait:#B45309;--no:#B91C1C;--okbg:#DCFCE7;--waitbg:#FEF3C7;--nobg:#FEE2E2;--oktx:#14532D;--waittx:#78350F;--notx:#7F1D1D;
  --topbg:rgba(245,245,249,.94);--navbg:rgba(255,255,255,.97);--shadow:0 1px 2px rgba(22,20,46,.06),0 6px 18px -10px rgba(22,20,46,.18);
  --disp:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --c1:#4F46E5;--onc:#fff;
  color-scheme:light;
}
:root,[style*="--c1"]{--t:color-mix(in srgb,var(--c1) 9%,#fff);--t2:color-mix(in srgb,var(--c1) 18%,#fff);--t3:color-mix(in srgb,var(--c1) 34%,#fff);--deep:color-mix(in srgb,var(--c1) 82%,#000)}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{
  --bg:#111117;--sf:#1B1B23;--sf2:#24242E;--sf3:#30303C;--line:#2F2F3B;--ink:#F4F4F8;--soft:#C6C5D4;--faint:#9897AD;
  --okbg:rgba(34,197,94,.18);--waitbg:rgba(245,158,11,.18);--nobg:rgba(239,68,68,.18);--oktx:#A7F3C0;--waittx:#FCD58A;--notx:#FFB4B4;
  --topbg:rgba(17,17,23,.94);--navbg:rgba(27,27,35,.97);--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
  :root[data-theme="auto"],:root[data-theme="auto"] [style*="--c1"]{--t:color-mix(in srgb,var(--c1) 16%,#1B1B23);--t2:color-mix(in srgb,var(--c1) 28%,#1B1B23);--t3:color-mix(in srgb,var(--c1) 45%,#1B1B23);--deep:color-mix(in srgb,var(--c1) 45%,#fff)}}
:root[data-theme="dark"]{
  --bg:#111117;--sf:#1B1B23;--sf2:#24242E;--sf3:#30303C;--line:#2F2F3B;--ink:#F4F4F8;--soft:#C6C5D4;--faint:#9897AD;
  --okbg:rgba(34,197,94,.18);--waitbg:rgba(245,158,11,.18);--nobg:rgba(239,68,68,.18);--oktx:#A7F3C0;--waittx:#FCD58A;--notx:#FFB4B4;
  --topbg:rgba(17,17,23,.94);--navbg:rgba(27,27,35,.97);--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
:root[data-theme="dark"],:root[data-theme="dark"] [style*="--c1"]{--t:color-mix(in srgb,var(--c1) 16%,#1B1B23);--t2:color-mix(in srgb,var(--c1) 28%,#1B1B23);--t3:color-mix(in srgb,var(--c1) 45%,#1B1B23);--deep:color-mix(in srgb,var(--c1) 45%,#fff)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--body);min-height:100vh;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--topbg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
img{max-width:100%;display:block}
.hidden{display:none!important}
.i{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.app{max-width:780px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--soft)}.faint{color:var(--faint)}.small{font-size:.88rem}.tiny{font-size:.76rem}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.wrap-row{display:flex;flex-wrap:wrap;gap:8px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100}
.splash .lg{width:96px;height:96px;animation:rise 1.2s ease-in-out infinite alternate}
@keyframes rise{from{transform:translateY(6px)}to{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.splash .lg{animation:none}}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;margin:0 -16px 8px;background:var(--topbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font:800 1.2rem/1.15 var(--disp);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sf);border:1px solid var(--line);color:var(--ink);flex:none;font-size:1.1rem}
.mb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--onc);background:var(--c1);flex:none;font-size:1.15rem}

/* início */
.hhead{display:flex;align-items:center;gap:12px;padding:14px 0 6px}
.wm{font:800 1.35rem/1 var(--disp);letter-spacing:-.02em}
.wm small{display:block;font:600 .8rem var(--body);color:var(--faint);letter-spacing:0;margin-top:4px}
.hello{font:800 clamp(1.9rem,7vw,2.6rem)/1.05 var(--disp);letter-spacing:-.03em;margin:16px 0 4px;color:var(--ink)}
.quote{position:relative;border-radius:22px;padding:22px 20px 18px 24px;margin:16px 0 6px;background:var(--qb);color:var(--ink);border:1px solid var(--qa2);overflow:hidden}
.quote::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--qa)}
.quote::after{content:"”";position:absolute;right:14px;top:-18px;font:800 7rem/1 var(--disp);color:var(--qa);opacity:.22;pointer-events:none}
.quote p{font:700 clamp(1.2rem,5vw,1.5rem)/1.32 var(--disp);margin:0 0 14px;position:relative;text-wrap:pretty}
.quote .by{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;color:var(--qt)}
.quote .nx{margin-left:auto;white-space:nowrap;flex:none;background:var(--sf);color:var(--ink);border:1px solid var(--qa2);border-radius:999px;padding:7px 12px;font-weight:800;font-size:.8rem;display:inline-flex;gap:6px;align-items:center}
.quote.q0{--qb:#FFF6DB;--qa:#F59E0B;--qa2:#F7D68A;--qt:#92400E}
.quote.q1{--qb:#E8F3FF;--qa:#2563EB;--qa2:#B7D3FB;--qt:#1E40AF}
.quote.q2{--qb:#E7F8EF;--qa:#16A34A;--qa2:#A8E3C0;--qt:#166534}
.quote.q3{--qb:#F2EDFF;--qa:#7C3AED;--qa2:#CDBDF7;--qt:#5B21B6}
.quote.q4{--qb:#FFEDEB;--qa:#E11D48;--qa2:#F7B9C3;--qt:#9F1239}
:root[data-theme="dark"] .quote{--qb:var(--sf);--qt:var(--qa)}
@media (prefers-color-scheme:dark){:root[data-theme="auto"] .quote{--qb:var(--sf);--qt:var(--qa)}}
.sec{display:flex;align-items:baseline;gap:10px;margin:28px 0 10px}
.sec h2{font:800 1.14rem var(--disp);margin:0;letter-spacing:-.01em}
.sec .lk{margin-left:auto;color:var(--deep);font-weight:800;font-size:.86rem}

/* escada da semana */
.stairs{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:16px 16px 12px;box-shadow:var(--shadow)}
.stairs .bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;margin-top:10px}
.stairs .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.stairs .b i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--sf3);min-height:8px}
.stairs .b.on i{background:var(--brand)}
.stairs .b.td i{background:var(--sun)}
.stairs .b span{font-size:.72rem;font-weight:800;color:var(--faint)}
.stairs .b.td span{color:var(--ink)}
.stairs .b em{font-style:normal;font-size:.74rem;font-weight:800;color:var(--soft)}
.big{font:800 2rem/1 var(--disp);letter-spacing:-.03em}

/* check rápido */
.quick{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x proximity}
.quick::-webkit-scrollbar{display:none}
.qk{flex:0 0 112px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:16px;background:var(--sf);border:1.5px solid var(--line);text-align:left;font-weight:800;font-size:.82rem;line-height:1.2;min-height:94px;position:relative;color:var(--ink)}
.qk .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--t2);color:var(--deep);font-size:1.05rem}
.qk.on{background:var(--c1);color:#fff;border-color:var(--c1)}
.qk.on .dot{background:rgba(255,255,255,.22);color:#fff}
.qk .ok{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--c1);display:grid;place-items:center;font-size:.8rem}
@media (min-width:700px){.quick{display:grid;grid-template-columns:repeat(7,1fr);overflow:visible;margin:0;padding:0}.qk{flex:none}}

/* grade de módulos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;align-items:center;gap:11px;padding:12px;border-radius:16px;background:var(--t);border:1.5px solid var(--t2);text-align:left;font-weight:800;font-size:.9rem;line-height:1.2;min-height:66px;color:var(--ink)}
.tile .mb{width:38px;height:38px;border-radius:11px}
.tile:hover{border-color:var(--t3)}
.tile:active{transform:scale(.98)}
.grp{font:800 .95rem var(--disp);margin:22px 2px 9px;color:var(--ink);display:flex;align-items:center;gap:8px}
.grp .chip{margin-left:auto}

/* cartões */
.card{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:10px}
.hero{border-radius:20px;padding:18px;background:var(--t);border:1.5px solid var(--t2);color:var(--ink);position:relative}
.hero h2{font:800 1.5rem/1.1 var(--disp);margin:0 0 4px;letter-spacing:-.02em;color:var(--ink)}
.hero .muted{color:var(--soft)}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero .stats div{background:var(--sf);border:1px solid var(--t2);border-radius:12px;padding:9px 10px}
.hero .stats b{display:block;font:800 1.35rem/1.1 var(--disp);color:var(--deep)}
.hero .stats span{font-size:.74rem;font-weight:700;color:var(--soft)}
.hero .mb{width:52px;height:52px;border-radius:14px}
.item{display:flex;align-items:flex-start;gap:12px;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(22,20,46,.04)}
.item .ibody{flex:1;min-width:0;text-align:left;display:block}
.item .ibody.row{display:flex;align-items:center;gap:12px}
.item b{display:block;font-weight:800;line-height:1.3}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.item p{margin:6px 0 0;color:var(--soft);font-size:.88rem;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.strike{text-decoration:line-through;opacity:.55}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--t3);display:grid;place-items:center;color:transparent;flex:none;margin-top:1px;background:var(--sf)}
.ck.on{background:var(--c1);border-color:var(--c1);color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.74rem;background:var(--sf2);color:var(--soft);white-space:nowrap;border:1px solid var(--line)}
.chip.c{background:var(--okbg);color:var(--oktx);border-color:transparent}.chip.a{background:var(--waitbg);color:var(--waittx);border-color:transparent}.chip.n{background:var(--nobg);color:var(--notx);border-color:transparent}
.chip.m{background:var(--t2);color:var(--deep);border-color:transparent}
.bar{height:8px;border-radius:8px;background:var(--sf3);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:8px;background:var(--c1)}
.empty{text-align:center;padding:30px 18px;border:2px dashed var(--t3);background:var(--t);border-radius:20px;color:var(--soft)}
.empty .mb{margin:0 auto 10px;width:52px;height:52px;border-radius:15px;font-size:1.4rem}
.empty b{display:block;font:800 1.05rem var(--disp);color:var(--ink);margin-bottom:4px}
.note{font-size:.84rem;color:var(--ink);background:var(--t);border:1px solid var(--t2);border-radius:12px;padding:10px 12px;margin:10px 0}
.note .i{color:var(--deep)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:12px 18px;font-weight:800;color:#fff;background:var(--c1);border:1.5px solid var(--c1);text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--sf);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--nobg);color:var(--notx);border-color:transparent}
.btn.sm{padding:8px 12px;font-size:.84rem;border-radius:11px}
.btn.full{width:100%}.btn:disabled{opacity:.45}
.lnk{color:var(--deep);font-weight:800}
.fab{position:fixed;right:max(18px,calc(50vw - 372px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:22;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:1.6rem;background:var(--c1);box-shadow:0 8px 20px -6px color-mix(in srgb,var(--c1) 60%,transparent)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--sf);border-radius:11px;padding:7px 12px;font-weight:800;font-size:.84rem}
.seg button[aria-pressed="true"]{border-color:var(--c1);background:var(--c1);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border-radius:999px;padding:8px 14px;font-weight:800;font-size:.86rem;background:var(--sf);border:1.5px solid var(--line)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--sf);border:1.5px solid var(--line);border-radius:13px;padding:0 12px;margin:6px 0 10px}
.search input{flex:1;border:0;background:none;padding:11px 0;outline:none}
.qadd{display:flex;gap:8px;margin:6px 0 12px}
.qadd input{flex:1;min-width:0;background:var(--sf);border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;outline:none}
.qadd input:focus{border-color:var(--c1)}

/* formulário */
.fld{display:block;margin:12px 0}
.fld>span{display:block;font-size:.8rem;font-weight:800;color:var(--soft);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--sf);border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px var(--t2)}
.fld textarea{min-height:110px;resize:vertical;line-height:1.5}
.fld textarea.tall{min-height:260px}
.fld input[type=range]{padding:0;accent-color:var(--c1);background:none;border:0;box-shadow:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .fld{margin:12px 0 0}
.stars{display:flex;gap:4px}.stars button{font-size:1.6rem;color:var(--sf3);line-height:1}.stars button.on{color:#F59E0B}

/* folha */
.sheet{position:fixed;inset:0;z-index:85;background:rgba(15,14,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--sf);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet .in{animation:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font:800 1.3rem var(--disp);margin:0 0 4px;letter-spacing:-.01em}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.btns.h{flex-direction:row}.btns.h .btn{flex:1}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:.72rem;color:var(--faint);text-align:center;font-weight:800;padding:2px 0}
.day{aspect-ratio:1;border-radius:11px;background:var(--sf);border:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:.92rem;padding:0;color:var(--ink)}
.day.out{visibility:hidden}
.day.fut{color:var(--faint)}
.day.td{border:2.5px solid var(--c1);color:var(--deep)}
.day.done{background:var(--c1);color:#fff;border-color:var(--c1)}
.day.done .i{font-size:.8rem;margin-top:1px}
.day.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.day.ph .dn{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.62);color:#fff;border-radius:7px;font-size:.7rem;padding:1px 6px;z-index:1}
.day.ph::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2.5px var(--c1);border-radius:11px}
.day .dots{display:flex;gap:2px;height:6px;margin-top:3px;flex-wrap:wrap;justify-content:center;max-width:90%}
.day .dots i{width:5px;height:5px;border-radius:50%}
.day.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.calnav{display:flex;align-items:center;gap:10px;margin:10px 0 12px}
.calnav h3{flex:1;margin:0;font:800 1.15rem var(--disp);text-align:center}

/* gastos */
.mbars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:140px}
.mbars button{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;padding:0}
.mbars i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--t3);min-height:5px}
.mbars button[aria-pressed="true"] i{background:var(--c1)}
.mbars span{font-size:.64rem;font-weight:800;color:var(--faint)}
.mbars button[aria-pressed="true"] span{color:var(--ink)}
.cbar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--sf3);margin:10px 0;gap:2px}
.cbar i{display:block;height:100%}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.82rem}
.leg div{display:flex;align-items:center;gap:6px;min-width:0}.leg em{font-style:normal;font-weight:800;margin-left:auto}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.amt{font:800 1rem var(--disp);white-space:nowrap}

/* hábitos */
.hdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hhead2{margin-bottom:4px}
.hd{font-size:.7rem;font-weight:800;color:var(--faint);text-align:center;line-height:1.15}
.hd.td{color:var(--deep)}
.hrow{padding:10px 0;border-top:1px solid var(--line)}
.hn{font-weight:800;font-size:.95rem;text-align:left;margin-bottom:8px;display:block}
.hn small{color:var(--faint);font-weight:700;font-size:.74rem;margin-left:4px}
.hc{width:100%;max-width:46px;aspect-ratio:1;justify-self:center;border-radius:11px;border:2px solid var(--t3);display:grid;place-items:center;color:transparent;background:var(--sf)}
.hc.on{background:var(--c1);color:#fff;border-color:var(--c1)}
.rw{display:flex;align-items:center;gap:12px}
.rw .gift{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--t2);color:var(--deep);font-size:1.3rem;flex:none}

/* editais */
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 16px;margin:0 -16px;scrollbar-width:none;align-items:flex-start}
.board::-webkit-scrollbar{display:none}
.col{flex:0 0 min(84vw,330px);scroll-snap-align:center;background:var(--sf);border:1px solid var(--line);border-top:5px solid var(--c1);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.col.new{border:2px dashed var(--t3);background:var(--t);align-items:center;justify-content:center;min-height:200px;color:var(--deep);font-weight:800;gap:10px;box-shadow:none}
.colh{display:flex;align-items:flex-start;gap:8px}
.colh h3{font:800 1.1rem/1.2 var(--disp);margin:0;flex:1}
.pp{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--sf2);font-weight:700;border-left:5px solid var(--faint)}
.pp.c{border-left-color:var(--ok)}.pp.a{border-left-color:var(--wait)}.pp.n{border-left-color:var(--no)}
.pp .chip{margin-left:auto}
.dotsnav{display:flex;justify-content:center;gap:6px;margin-top:2px}
.dotsnav i{width:7px;height:7px;border-radius:50%;background:var(--sf3)}
.dotsnav i.on{background:var(--c1);width:20px;border-radius:9px}
.stbtn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);font-weight:800;text-align:left;background:var(--sf)}
.stbtn .n{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font:800 1rem var(--disp)}
.stbtn[aria-pressed="true"]{border-color:var(--ink)}

/* hiit */
.vid{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.vid .num{width:64px;height:64px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:var(--c1);flex:none;line-height:1}
.vid .num small{font-size:.6rem;font-weight:800;letter-spacing:.06em}
.vid .num b{font:800 1.7rem var(--disp)}
.ex{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.ex .n{width:30px;height:30px;border-radius:9px;background:var(--t2);display:grid;place-items:center;font:800 .95rem var(--disp);color:var(--deep);flex:none}
.mv{display:flex;flex-direction:column;gap:2px}.mv button{width:28px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--faint)}

/* fotos */
.pgrid{--cols:3;display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4px;border-radius:14px;overflow:hidden;touch-action:pan-y}
.pgrid button{aspect-ratio:1;background:var(--sf3);overflow:hidden;padding:0}
.pgrid img{width:100%;height:100%;object-fit:cover}
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.alb{text-align:left;display:block}
.alb .cv{aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--t2);display:grid;place-items:center;color:var(--deep);font-size:2rem;position:relative;border:1px solid var(--t3)}
.alb .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.alb b{display:block;margin-top:7px;font-weight:800;line-height:1.25}
.alb span{font-size:.78rem;color:var(--faint);font-weight:700}
.subs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.subs .alb{flex:0 0 112px}.subs .alb .cv{border-radius:14px;font-size:1.4rem}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.84rem;font-weight:700;color:var(--faint);margin:2px 0 10px}
.crumbs button{color:var(--deep);font-weight:800}
.pick{display:grid;place-items:center;gap:6px;width:100%;aspect-ratio:4/3;border-radius:16px;border:2px dashed var(--t3);background:var(--t);color:var(--soft);font-weight:800;overflow:hidden;position:relative}
.pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pick .i{font-size:1.8rem;color:var(--deep)}
.thm{display:block;width:52px;height:52px;border-radius:12px;overflow:hidden;flex:none}.thm img{width:100%;height:100%;object-fit:cover}

/* visualizador */
.viewer{position:fixed;inset:0;z-index:80;background:#09090D;color:#fff;display:flex;flex-direction:column;touch-action:pan-y}
.viewer .vt{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
.viewer .vt .ib{background:rgba(255,255,255,.12);border:0;color:#fff}
.viewer .stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.viewer .stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:transform .2s ease}
.viewer .cap{padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.55)}
.viewer .cap b{display:block;font:800 1.2rem var(--disp)}
.viewer .cap span{opacity:.88}
.viewer .nv{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.viewer .nv.l{left:10px}.viewer .nv.r{right:10px}
@media (hover:none){.viewer .nv{display:none}}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--navbg);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:800;color:var(--faint);padding:5px 0}
.nav button .i{font-size:1.35rem}
.nav button[aria-current="true"]{color:var(--ink)}
.nav button[aria-current="true"] .pill{background:var(--brand);color:#fff}
.nav .pill{display:grid;place-items:center;width:52px;height:30px;border-radius:999px}

/* avisos */
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px);pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:#16142E;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);animation:up .2s ease-out;font-size:.9rem}
.toast b{display:block}.toast span{display:block;opacity:.85;font-size:.82rem}
.toast .ti{width:30px;height:30px;border-radius:9px;background:var(--c1);color:#fff;display:grid;place-items:center;flex:none}

.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--c1) calc(var(--p)*1%),var(--sf3) 0);display:grid;place-items:center;flex:none}
.ring b{width:58px;height:58px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font:800 1rem var(--disp);color:var(--deep)}
.foot{text-align:center;color:var(--faint);font-size:.76rem;margin:30px 0 0}

/* arrastar e zoom */
.grip{display:grid;place-items:center;width:22px;height:30px;color:var(--faint);cursor:grab;flex:none;margin-left:-4px}
.colh{cursor:grab;touch-action:pan-y}
.board.dragging{scroll-snap-type:none}
.sg{opacity:.35}
.sc{box-shadow:0 12px 30px -8px rgba(22,20,46,.35)!important;transform:rotate(-1deg)}
.alb{touch-action:pan-y}
.zoomctl{margin-left:auto;display:flex;align-items:center;gap:6px}
.zoomctl .ib{width:34px;height:34px;border-radius:10px}
.sec .chip+.zoomctl{margin-left:auto}
.imp{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:var(--sf)}
.imp.off{opacity:.5}
.imp .ih{display:flex;gap:8px;align-items:center}
.imp .ih input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:800;background:var(--sf)}
.imp select{width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--sf)}
.ir{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.ir .nm{flex:1;min-width:0;font-weight:700}
.ir .nm small{display:block;font-weight:700;color:var(--faint);font-size:.72rem}
.ir.off .nm{text-decoration:line-through;opacity:.5}
.ist{display:flex;gap:3px}
.ist button{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);font-weight:800;font-size:.8rem;background:var(--sf)}
.ist button.on.c{background:var(--ok);border-color:var(--ok);color:#fff}
.ist button.on.a{background:var(--wait);border-color:var(--wait);color:#fff}
.ist button.on.n{background:var(--no);border-color:var(--no);color:#fff}
.tg{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.tg.on{background:var(--c1);border-color:var(--c1);color:#fff}
.btns.stk{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));background:var(--sf);padding:10px 0 calc(18px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-22px - env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}

/* editais em tela cheia */
.app.wide{max-width:none;padding-left:24px;padding-right:24px}
.app.wide .top{margin:0 -24px 8px;padding:10px 24px}
.app.wide .board{margin:0 -24px;padding:4px 24px 16px}
.edsum{display:grid;gap:10px;margin-bottom:12px}
@media (min-width:900px){.edsum{grid-template-columns:auto 1fr;align-items:stretch}.edsum .note{display:flex;align-items:center}}
@media (max-width:600px){.app.wide{padding-left:16px;padding-right:16px}.app.wide .top{margin:0 -16px 8px;padding:10px 16px}.app.wide .board{margin:0 -16px;padding:4px 16px 16px}}
.ppv{display:block;font-size:.76rem;font-weight:700;color:var(--oktx);margin-top:2px}
.albums{align-items:start}
.edst{display:flex;gap:24px;flex-wrap:wrap}.edst h2{font-size:2rem;margin:0}
@media (max-width:600px){.edst{gap:18px}.edst h2{font-size:1.45rem}}
.glt{margin-top:10px}
.glr{display:grid;grid-template-columns:1fr 1fr 34px;grid-template-areas:"v p x" "i i i" "c c c";gap:6px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.glr input,.glr select{border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--sf);min-width:0;font-size:.88rem}
.glr .glv{grid-area:v;font-weight:800}.glr select:first-of-type{grid-area:p}.glr .gli{grid-area:i}.glr .ib{grid-area:x;width:34px;height:34px}
.glr .glc{grid-area:c;font-size:.8rem;padding:6px 8px}
@media (min-width:620px){.glr{grid-template-columns:110px 110px 1fr 150px 34px;grid-template-areas:"v p i c x"}}
.glr.off{opacity:.45}.glr.off .gli{text-decoration:line-through}
code{background:var(--sf2);border-radius:6px;padding:1px 6px;font-size:.82rem}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--t);border:1.5px solid var(--t2);border-radius:16px;padding:12px;min-width:0}
.stats3 b{font:800 1.05rem/1.15 var(--disp);word-break:break-word}
@media (max-width:420px){.stats3{grid-template-columns:1fr 1fr}.stats3 button:first-child{grid-column:1/-1}}
.hgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.hgrid2{grid-template-columns:1fr}}
.hchip{display:flex;align-items:center;gap:10px;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:800;font-size:.9rem}
.hchip.on .grow{text-decoration:line-through;opacity:.55}
.hchip .ck{width:26px;height:26px;margin:0}
.grp.blk{margin-top:26px}.grp.blk .chip{margin-left:auto}.grp.blk .ib{margin-left:4px}
.ednbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:22;display:flex;align-items:center;gap:10px;width:min(92vw,560px);padding:12px 16px;border-radius:16px;background:#16142E;color:#fff;font-weight:800;box-shadow:0 10px 30px -8px rgba(22,20,46,.5)}
.ednct{background:#F59E0B;color:#16142E;border-radius:999px;padding:1px 9px;font-size:.78rem}
.app.wide{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.ppr{display:block;font-size:.74rem;font-weight:800;color:var(--waittx);margin-top:2px}.ppr.ok{color:var(--oktx)}

</style>

"use strict";

/* ================= ARMAZENAMENTO ================= */
/* Dois modos, como o G3 tinha (Local + Firebase): no claude.ai os dados ficam na sua conta (db + assets);
   instalado como PWA em outro servidor, ficam no aparelho (IndexedDB). */
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open("movingup",1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("docs"))d.createObjectStore("docs",{keyPath:"id"});if(!d.objectStoreNames.contains("imgs"))d.createObjectStore("imgs");};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const idbReq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
let IDB=null;
async function idb(){if(!IDB)IDB=await idbOpen();return IDB;}
const LURL=new Map();
const LocalImgs={
  async put(full,thumb){const id="L"+nid(),d=await idb();const tx=d.transaction("imgs","readwrite");tx.objectStore("imgs").put(full,id+"f");tx.objectStore("imgs").put(thumb,id+"t");await new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=()=>j(tx.error);});return{s:"l",f:id+"f",t:id+"t"};},
  async url(key){if(LURL.has(key))return LURL.get(key);const d=await idb();const b=await idbReq(d.transaction("imgs").objectStore("imgs").get(key));if(!b)return"";const u=URL.createObjectURL(b);LURL.set(key,u);return u;},
  async del(ref){try{const d=await idb();const tx=d.transaction("imgs","readwrite");tx.objectStore("imgs").delete(ref.f);tx.objectStore("imgs").delete(ref.t);}catch(e){}}
};
function LocalBackend(){return{kind:"local",
  async loadAll(){const d=await idb();return idbReq(d.transaction("docs").objectStore("docs").getAll());},
  async put(doc){const d=await idb();return idbReq(d.transaction("docs","readwrite").objectStore("docs").put(doc));},
  async del(id){const d=await idb();return idbReq(d.transaction("docs","readwrite").objectStore("docs").delete(id));},
  imgs:LocalImgs};}
function CloudBackend(db,uid,assets){const col=db.collection("data/users/"+uid);const Q={};
  const chain=(id,fn)=>{const p=(Q[id]||Promise.resolve()).catch(()=>{}).then(fn);Q[id]=p;return p;};
  const retry=async fn=>{try{return await fn();}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*900));return fn();}throw e;}};
  const cloudImgs={async put(full,thumb){const a=await assets.upload(full,{type:"image/jpeg"});const b=await assets.upload(thumb,{type:"image/jpeg"});return{s:"c",f:a.id,t:b.id};},
    async url(key){return"/_blob/"+key;},async del(ref){try{await assets.delete(ref.f);await assets.delete(ref.t);}catch(e){}}};
  return{kind:"cloud",
    async loadAll(){const out=[];let last="";for(let g=0;g<40;g++){let q=last?col.where("id",">",last).orderBy("id").limit(1000):col.orderBy("id").limit(1000);const s=await retry(()=>q.get());s.docs.forEach(d=>out.push(JSON.parse(JSON.stringify(d.data()))));if(s.size<1000)break;last=s.docs[s.size-1].id;}return out;},
    put(doc){const body=JSON.parse(JSON.stringify(doc));return chain(doc.id,()=>retry(()=>col.doc(doc.id).set(body)));},
    del(id){return chain(id,()=>retry(()=>col.doc(id).delete()));},
    imgs:assets?cloudImgs:LocalImgs};}


/* ---------- Firebase (quando o config.js tiver as chaves) ---------- */
const blobToDataURL=b=>new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(b);});
const FURL=new Map();let FDB=null,FUID=null;
const dataURLToBlob=u=>{const[h,b]=u.split(",");const mime=(h.match(/:(.*?);/)||[,"image/jpeg"])[1];const s=atob(b);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:mime});};
async function offGet(key){try{const d=await idb();return await idbReq(d.transaction("imgs").objectStore("imgs").get("fc_"+key));}catch(e){return null;}}
async function offPut(key,blob){try{const d=await idb();const tx=d.transaction("imgs","readwrite");tx.objectStore("imgs").put(blob,"fc_"+key);await new Promise(r=>{tx.oncomplete=r;tx.onerror=r;});}catch(e){}}
async function offHas(key){try{const d=await idb();const k=await idbReq(d.transaction("imgs").objectStore("imgs").getKey("fc_"+key));return k!==undefined;}catch(e){return false;}}
const FireImgs={
  col(){return FDB.collection("users").doc(FUID).collection("imgs");},
  async put(full,thumb){const id="F"+nid();const[a,b]=await Promise.all([blobToDataURL(full),blobToDataURL(thumb)]);
    await Promise.all([this.col().doc(id+"f").set({b:a}),this.col().doc(id+"t").set({b:b})]);offPut(id+"f",full);offPut(id+"t",thumb);FURL.set(id+"f",a);FURL.set(id+"t",b);return{s:"f",f:id+"f",t:id+"t"};},
  async url(key){if(FURL.has(key))return FURL.get(key);
    const off=await offGet(key);if(off){const u=URL.createObjectURL(off);FURL.set(key,u);return u;}
    const ref=this.col().doc(key);let d=null;try{d=await ref.get({source:"cache"});}catch(e){}if(!d||!d.exists)d=await ref.get();const u=d.exists?d.data().b:"";
    if(u){FURL.set(key,u);try{offPut(key,dataURLToBlob(u));}catch(e){}}return u;},
  async del(ref){try{await this.col().doc(ref.f).delete();await this.col().doc(ref.t).delete();}catch(e){}try{const d=await idb();const tx=d.transaction("imgs","readwrite");tx.objectStore("imgs").delete("fc_"+ref.f);tx.objectStore("imgs").delete("fc_"+ref.t);}catch(e){}}
};
function FireBackend(db,uid){FDB=db;FUID=uid;const col=db.collection("users").doc(uid).collection("docs");let first=true;
  return{kind:"firebase",imgs:FireImgs,
    loadAll(){return new Promise((res,rej)=>{col.onSnapshot(s=>{if(first){first=false;res(s.docs.map(d=>d.data()));return;}
        if(s.metadata.hasPendingWrites)return;let mud=false;s.docChanges().forEach(ch=>{const d=ch.doc.data();
          if(ch.type==="removed"){if(DB.docs.has(ch.doc.id)){DB.docs.delete(ch.doc.id);mud=true;}}
          else{const l=DB.docs.get(ch.doc.id);if(!l||l.u!==d.u){DB.docs.set(ch.doc.id,d);mud=true;}}});
        if(mud&&$("sheet").classList.contains("hidden")&&!VW&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))rr();},
      e=>{if(first){first=false;rej(e);}else console.warn(e);});});},
    put(doc){return col.doc(doc.id).set(JSON.parse(JSON.stringify(doc)));},
    del(id){return col.doc(id).delete();}};}

const DB={docs:new Map(),be:null};
const all=c=>{const o=[];DB.docs.forEach(d=>{if(d.c===c)o.push(d);});return o;};
const getD=id=>DB.docs.get(id);
function saveErr(e){const c=e&&e.code;toast("triangle-alert","Não foi possível salvar",c==="quota_exceeded"?"O espaço de dados acabou. Apague itens antigos para continuar.":"Verifique a conexão e tente de novo.");}
function save(doc){doc.u=Date.now();DB.docs.set(doc.id,doc);DB.be.put(doc).catch(saveErr);return doc;}
function removeDoc(id){const d=DB.docs.get(id);DB.docs.delete(id);DB.be.del(id).catch(saveErr);if(d&&d.img)DB.be.imgs.del(d.img);}
function single(id,def){return DB.docs.get(id)||Object.assign({id,c:"single"},JSON.parse(JSON.stringify(def)));}

async function loadBitmap(file){try{return await createImageBitmap(file,{imageOrientation:"from-image"});}catch(e){}
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u;});}
const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,"image/jpeg",q));
async function processImage(file){const im=await loadBitmap(file);const W=im.width,H=im.height;
  let mx=1800,q=.84,full=null;for(let i=0;i<6;i++){const s=Math.min(1,mx/Math.max(W,H));const c=document.createElement("canvas");c.width=Math.round(W*s);c.height=Math.round(H*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);full=await toBlob(c,q);if(full.size<680000)break;mx=Math.round(mx*.8);q=Math.max(.6,q-.06);}
  const m=Math.min(W,H),t=document.createElement("canvas");t.width=t.height=360;t.getContext("2d").drawImage(im,(W-m)/2,(H-m)/2,m,m,0,0,360,360);const thumb=await toBlob(t,.78);
  return{full,thumb,preview:URL.createObjectURL(thumb)};}
async function storeImage(p){return DB.be.imgs.put(p.full,p.thumb);}
function imgTag(ref,size="t",cls="",alt=""){if(!ref)return"";const key=ref[size];if(ref.s==="f")return `<img class="${cls}" data-fk="${esc(key)}" alt="${esc(alt)}" decoding="async">`;if(ref.s==="m")return `<img class="${cls}" src="${esc(key)}" alt="${esc(alt)}">`;if(ref.s==="c")return `<img class="${cls}" src="/_blob/${esc(key)}" alt="${esc(alt)}" loading="lazy" decoding="async">`;
  return `<img class="${cls}" data-lk="${esc(key)}" alt="${esc(alt)}" decoding="async">`;}
async function imgURL(ref,size="f"){if(!ref)return"";if(ref.s==="f")return FireImgs.url(ref[size]);if(ref.s==="m")return ref[size];return ref.s==="c"?"/_blob/"+ref[size]:LocalImgs.url(ref[size]);}
function hydrate(root){qa("img[data-lk]",root).forEach(async im=>{const u=await LocalImgs.url(im.dataset.lk);if(u)im.src=u;im.removeAttribute("data-lk");});
  qa("img[data-fk]",root).forEach(async im=>{const k=im.dataset.fk;im.removeAttribute("data-fk");try{const u=await FireImgs.url(k);if(u)im.src=u;}catch(e){}});}
const FILE=document.createElement("input");FILE.type="file";FILE.accept="image/*";FILE.style.display="none";
function pickFiles(multi,accept="image/*"){FILE.multiple=!!multi;FILE.accept=accept;FILE.value="";return new Promise(res=>{FILE.onchange=()=>res([...FILE.files]);FILE.click();});}

let VIEW={v:"home"},STACK=[],GUARD=false;
function guard(){if(GUARD)return;try{history.pushState({mu:1},"");GUARD=true;}catch(e){}}
function go(v){STACK.push(VIEW);VIEW=v;window.scrollTo(0,0);render();guard();}
function tab(v){STACK=[];VIEW=v;window.scrollTo(0,0);render();if(v.v!=="home")guard();}
function back(){VIEW=STACK.pop()||{v:"home"};render();}

function fieldHTML(f,v){const id="f_"+f.k;v=v==null?(f.def!=null?(typeof f.def==="function"?f.def():f.def):""):v;const L=`<span>${esc(f.l)}</span>`;
  switch(f.type){
    case"textarea":return `<label class="fld">${L}<textarea id="${id}" class="${f.tall?"tall":""}" placeholder="${esc(f.ph||"")}">${esc(v)}</textarea></label>`;
    case"number":return `<label class="fld">${L}<input id="${id}" inputmode="decimal" value="${esc(v)}" placeholder="${esc(f.ph||"")}"></label>`;
    case"money":return `<label class="fld">${L}<input id="${id}" inputmode="decimal" value="${v!==""?esc(String(v).replace(".",",")):""}" placeholder="0,00"></label>`;
    case"date":return `<label class="fld">${L}<input id="${id}" type="date" value="${esc(v)}"></label>`;
    case"time":return `<label class="fld">${L}<input id="${id}" type="time" value="${esc(v)}"></label>`;
    case"select":case"status":{const opts=(typeof f.opts==="function"?f.opts():f.opts).map(o=>Array.isArray(o)?o:[o,o]);if(v===""&&opts.length&&f.type==="status")v=opts[0][0];
      return `<div class="fld">${L}<div class="seg" data-k="${f.k}">${opts.map(o=>`<button type="button" data-a="seg" data-v="${esc(o[0])}" aria-pressed="${String(v)===String(o[0])}">${esc(o[1])}</button>`).join("")}</div></div>`;}
    case"pct":return `<label class="fld">${L.replace("</span>",` · <b id="${id}_v">${+v||0}%</b></span>`)}<input id="${id}" type="range" min="0" max="100" step="5" value="${+v||0}" data-in="pctLbl"></label>`;
    case"stars":return `<div class="fld">${L}<div class="stars" id="${id}" data-v="${+v||0}">${[1,2,3,4,5].map(n=>`<button type="button" data-a="star" data-v="${n}" class="${n<=(+v||0)?"on":""}" aria-label="${n} estrelas">★</button>`).join("")}</div></div>`;
    case"check":return `<div class="fld"><div class="seg" data-k="${f.k}"><button type="button" data-a="seg" data-v="1" aria-pressed="${!!v}">${esc(f.l)}</button><button type="button" data-a="seg" data-v="" aria-pressed="${!v}">Ainda não</button></div></div>`;
    default:return `<label class="fld">${L}<input id="${id}" value="${esc(v)}" placeholder="${esc(f.ph||"")}" ${f.auto?"autofocus":""}></label>`;}}
CH.pctLbl=el=>{const l=$(el.id+"_v");if(l)l.textContent=el.value+"%";};
function readFields(fields,root){const o={};fields.forEach(f=>{const el=root.querySelector("#f_"+f.k);
  switch(f.type){case"number":o[f.k]=el.value.trim()===""?"":num(el.value);break;case"money":o[f.k]=num(el.value);break;
    case"select":case"status":o[f.k]=segVal(root,f.k);break;case"check":o[f.k]=!!segVal(root,f.k);break;
    case"pct":o[f.k]=+el.value;break;case"stars":o[f.k]=+el.dataset.v||0;break;default:o[f.k]=el.value.trim();}});return o;}

  const e=iso(dt).replace(/-/g,"")+"T"+pad(dt.getHours())+pad(dt.getMinutes())+"00";const R={d:"DAILY",w:"WEEKLY",m:"MONTHLY",y:"YEARLY"}[rep];
  let tz="";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone;}catch(x){}
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t)+"&dates="+s+"/"+e+(nota?"&details="+encodeURIComponent(nota):"")+(R?"&recur="+encodeURIComponent("RRULE:FREQ="+R):"")+(tz?"&ctz="+encodeURIComponent(tz):"");}

let VW=null;
function openViewer(items,i,opts={}){VW={items,i,opts};let d=$("viewer");if(!d){d=document.createElement("div");d.id="viewer";d.className="viewer";document.body.appendChild(d);}
  d.innerHTML=`<div class="vt"><button class="ib" data-a="vwClose" aria-label="Fechar">${ic("x")}</button><div class="grow small" id="vwN"></div>${opts.onEdit?`<button class="ib" data-a="vwEdit" aria-label="Editar">${ic("pencil")}</button>`:""}${opts.onDel?`<button class="ib" data-a="vwDel" aria-label="Apagar">${ic("trash-2")}</button>`:""}</div>
  <div class="stage" id="vwS"><img id="vwI" alt=""><button class="nv l" data-a="vwPrev" aria-label="Anterior">${ic("chevron-left")}</button><button class="nv r" data-a="vwNext" aria-label="Próxima">${ic("chevron-right")}</button></div><div class="cap" id="vwC"></div>`;
  document.body.style.overflow="hidden";guard();vwShow();
  const s=$("vwS");let x0=null,dx=0;
  s.addEventListener("pointerdown",e=>{x0=e.clientX;dx=0;$("vwI").style.transition="none";});
  s.addEventListener("pointermove",e=>{if(x0==null)return;dx=e.clientX-x0;$("vwI").style.transform=`translateX(${dx}px)`;});
  const end=()=>{if(x0==null)return;const im=$("vwI");im.style.transition="";im.style.transform="";if(Math.abs(dx)>50)vwGo(dx<0?1:-1);x0=null;};
  s.addEventListener("pointerup",end);s.addEventListener("pointercancel",end);s.addEventListener("pointerleave",end);}
async function vwShow(){if(!VW)return;const it=VW.items[VW.i];$("vwN").textContent=(VW.i+1)+" de "+VW.items.length;
  const im=$("vwI");im.src=await imgURL(it.ref,"t");imgURL(it.ref,"f").then(u=>{if(VW&&VW.items[VW.i]===it){const p=new Image();p.onload=()=>{if(VW&&VW.items[VW.i]===it)im.src=u;};p.src=u;}});
  $("vwC").innerHTML=(it.t||it.s)?`<b>${esc(it.t||"")}</b><span>${esc(it.s||"")}</span>`:"";
  [VW.i-1,VW.i+1].forEach(j=>{const n=VW.items[j];if(n)imgURL(n.ref,"f").then(u=>{const p=new Image();p.src=u;});});}
function vwGo(d){if(!VW)return;const n=VW.i+d;if(n<0||n>=VW.items.length)return;VW.i=n;vwShow();}
function closeViewer(){const d=$("viewer");if(d)d.remove();VW=null;document.body.style.overflow="";}
ACT.vwClose=()=>{closeViewer();};ACT.vwPrev=()=>vwGo(-1);ACT.vwNext=()=>vwGo(1);
ACT.vwDel=()=>{const it=VW.items[VW.i],o=VW.opts;confirmSheet("Apagar esta foto?","A foto será removida para sempre.","Apagar foto",()=>{o.onDel(it);VW.items.splice(VW.i,1);if(!VW.items.length){closeViewer();}else{VW.i=Math.min(VW.i,VW.items.length-1);vwShow();}rr();});};
ACT.vwEdit=()=>{const it=VW.items[VW.i],o=VW.opts;closeViewer();o.onEdit(it);};

/* ================= CALENDÁRIOS DE CHECK ================= */
function monthGrid(y,m,cell){const st=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let h=DSEM.map(d=>`<div class="h">${d}</div>`).join("");
  for(let i=0;i<st;i++)h+=`<div class="day out"></div>`;for(let d=1;d<=n;d++)h+=cell(y+"-"+pad(m+1)+"-"+pad(d),d);return `<div class="cal">${h}</div>`;}
function calNav(y,m,act){return `<div class="calnav"><button class="ib" data-a="${act}" data-d="-1" aria-label="Mês anterior">${ic("chevron-left")}</button><h3>${MESES[m]} ${y}</h3><button class="ib" data-a="${act}" data-d="1" aria-label="Próximo mês">${ic("chevron-right")}</button></div>`;}
function ym(){const n=new Date();return[VIEW.y??n.getFullYear(),VIEW.m??n.getMonth()];}
ACT.mNav=el=>{let[y,m]=ym();m+=+el.dataset.d;if(m<0){m=11;y--;}if(m>11){m=0;y++;}VIEW.y=y;VIEW.m=m;rr();};
function streakK(k){let d=TODAY();if(!trkHas(k,d))d=addDays(d,-1);let n=0;while(trkHas(k,d)){n++;d=addDays(d,-1);}return n;}
function trkDocs(k,prefix){return all("trk").filter(x=>x.k===k&&(!prefix||x.d.startsWith(prefix)));}
VIEWS.trk=()=>{const k=VIEW.k,m0=MODS[k],T=TRK[k],[y,m]=ym(),pre=y+"-"+pad(m+1),t=TODAY();
  const mes=trkDocs(k,pre),ano=trkDocs(k,String(y));const km=T.km?sum(mes.map(x=>x.km)):0;
  let h=topbar(m0.n,k)+`<div class="hero"><h2>${esc(m0.n)}</h2><div class="muted small">${T.photo?"Toque no dia para registrar com foto. A foto aparece no número do dia.":"Toque no dia para marcar o check."}</div>
   <div class="stats"><div><b>${mes.length}</b><span>neste mês</span></div><div><b>${streakK(k)}</b><span>dias seguidos</span></div><div><b>${T.km?km.toLocaleString("pt-BR",{maximumFractionDigits:1})+" km":ano.length}</b><span>${T.km?"no mês":"em "+y}</span></div></div></div>`;
  h+=calNav(y,m,"mNav")+monthGrid(y,m,(d,n)=>{const doc=getD(tid(k,d));const cls=(d===t?" td":"")+(d>t?" fut":"");
    if(doc&&doc.img)return `<button class="day ph${cls}" data-a="trkDay" data-d="${d}" aria-label="Dia ${n}, com foto">${imgTag(doc.img,"t")}<span class="dn">${n}</span></button>`;
    if(doc)return `<button class="day done${cls}" data-a="trkDay" data-d="${d}" aria-label="Dia ${n}, feito">${n}${ic("check")}</button>`;
    return `<button class="day${cls}" data-a="trkDay" data-d="${d}" aria-label="Dia ${n}">${n}</button>`;});
  const list=mes.sort((a,b)=>b.d.localeCompare(a.d));
  if(list.length){h+=`<div class="grp">Registros de ${MESES[m].toLowerCase()}</div>`+list.map(x=>`<div class="item"><button class="ibody row" data-a="trkDay" data-d="${x.d}">${x.img?`<span class="thm">${imgTag(x.img,"t")}</span>`:`<span class="mb" style="width:52px;height:52px">${ic(m0.ic)}</span>`}<span class="grow"><b>${esc(x.t||T.t)}</b><span class="small muted">${esc(flong(x.d))}${x.km?" · "+x.km+" km":""}${x.s?" · "+esc(x.s):""}</span></span></button></div>`).join("");}
  else h+=`<div style="margin-top:14px">${empty(k,"Nenhum registro neste mês","Toque em um dia do calendário para registrar.")}</div>`;
  return `<div class="app">${h}</div>`;};
ACT.trkDay=el=>{const k=VIEW.k,d=el.dataset.d,doc=getD(tid(k,d));
  if(TRK[k].photo){if(doc&&doc.img){const [y,m]=[d.slice(0,4),d.slice(5,7)];const ph=trkDocs(k,y+"-"+m).filter(x=>x.img).sort((a,b)=>a.d.localeCompare(b.d));
      const items=ph.map(x=>({ref:x.img,t:x.t||TRK[k].t,s:[flong(x.d),x.km?x.km+" km":"",x.s].filter(Boolean).join(" · "),id:x.id,d:x.d}));
      return openViewer(items,items.findIndex(x=>x.d===d),{onEdit:it=>trkSheet(k,it.d),onDel:it=>{removeDoc(it.id);}});}
    return trkSheet(k,d);}
  if(!doc){toggleSimple(k,d);rr();return;}
  sheet(`<h2>${esc(MODS[k].n)}</h2><div class="muted">${esc(flong(d))}</div><label class="fld"><span>Anotação (opcional)</span><textarea id="tN" placeholder="${k==="bib"?"Ex.: Salmos 23, Provérbios 3":"Ex.: 3h de Direito Constitucional"}">${esc(doc.s||"")}</textarea></label>
   <div class="btns"><button class="btn full" id="tS">Salvar anotação</button><button class="btn danger full" id="tX">Desmarcar o dia</button></div>`,s=>{
    s.querySelector("#tS").onclick=()=>{doc.s=s.querySelector("#tN").value.trim();save(doc);closeSheet();rr();};
    s.querySelector("#tX").onclick=()=>{removeDoc(doc.id);closeSheet();rr();};});};
function toggleSimple(k,d){const id=tid(k,d);if(DB.docs.has(id)){removeDoc(id);toast("rotate-ccw","Check removido",MODS[k].n);}else{save({id,c:"trk",k,d});toast("check",MODS[k].n+": check!",flong(d));}}
let PEND=null;
function trkSheet(k,d){const doc=getD(tid(k,d)),T=TRK[k];PEND=null;
  sheet(`<h2>${esc(MODS[k].n)}</h2><div class="muted" style="margin-bottom:10px">${esc(flong(d))}</div>
   <button class="pick" id="pk" data-a="pickTrk">${doc&&doc.img?imgTag(doc.img,"t"):""}<span>${ic("camera")}</span><span>${doc&&doc.img?"Trocar foto":"Tirar ou escolher foto"}</span></button>
   <label class="fld"><span>Título</span><input id="tT" value="${esc(doc?doc.t:"")}" placeholder="${esc(T.t)}"></label>
   <label class="fld"><span>Subtítulo / mensagem</span><input id="tSub" value="${esc(doc?doc.s:"")}" placeholder="Ex.: ${k==="gym"?"Peito e tríceps, carga nova!":k==="run"?"Ritmo 5:30, beira-mar":k==="swim"?"1.500 m, crawl":"Roda no grupo, aprendi um floreio"}"></label>
   ${T.km?`<label class="fld"><span>Distância (km)</span><input id="tK" inputmode="decimal" value="${doc&&doc.km?String(doc.km).replace(".",","):""}" placeholder="Ex.: 8,5"></label>`:""}
   <div class="btns"><button class="btn full" id="tS">${doc?"Salvar alterações":"Registrar treino"}</button>${doc?`<button class="btn danger full" id="tX">Apagar registro</button>`:""}</div>`,s=>{
    s.querySelector("#tS").onclick=async e=>{const b=e.currentTarget;b.disabled=true;b.textContent="Salvando…";
      try{const o=doc||{id:tid(k,d),c:"trk",k,d};o.t=s.querySelector("#tT").value.trim();o.s=s.querySelector("#tSub").value.trim();if(T.km)o.km=num(s.querySelector("#tK").value)||0;
        if(PEND){const old=o.img;o.img=await storeImage(PEND);if(old)DB.be.imgs.del(old);}save(o);closeSheet();rr();toast("check","Treino registrado!",o.t||T.t);}
      catch(err){b.disabled=false;b.textContent="Tentar de novo";toast("triangle-alert","A foto não foi enviada","Tente de novo ou escolha outra foto.");}};
    const x=s.querySelector("#tX");if(x)x.onclick=()=>{removeDoc(doc.id);closeSheet();rr();};});}
ACT.pickTrk=async el=>{const f=await pickFiles(false);if(!f.length)return;el.innerHTML=`<span>${ic("hourglass")}</span><span>Preparando foto…</span>`;
  try{PEND=await processImage(f[0]);el.innerHTML=`<img src="${PEND.preview}" alt=""><span></span>`;}catch(e){el.innerHTML=`<span>${ic("triangle-alert")}</span><span>Não deu para abrir esta imagem</span>`;}};

function metaSub(i){const a=+i.alvo||0,v=+i.atual||0,p=a?clamp(Math.round(v/a*100),0,100):(i.feito?100:0);
  return `<div class="meta">${i.prazo?`<span class="chip">até ${fdate(i.prazo)}</span>`:""}${a?`<span class="chip m">${v.toLocaleString("pt-BR")} / ${a.toLocaleString("pt-BR")} ${esc(i.un||"")}</span>`:""}${a?`<span class="chip">${p}%</span>`:""}</div>${i.esp?`<p>${esc(i.esp)}</p>`:""}${a?`<div class="bar"><i style="width:${p}%"></i></div>`:""}`;}
function progTop(items,k,label){const n=items.filter(i=>i[k]).length,p=items.length?Math.round(n/items.length*100):0;
  return `<div class="hero row" style="margin-bottom:10px"><div class="ring" style="--p:${p}"><b>${p}%</b></div><div><h2>${n} de ${items.length}</h2><div class="muted small">${esc(label)}</div></div></div>`;}
function autoSub(L,i){const parts=[];L.fields.forEach(f=>{if(f.k==="t"||f.k===L.check)return;const v=i[f.k];if(v===""||v==null||v===false)return;
  if(f.type==="status")parts.push(stChip(f,v));else if(f.type==="select")parts.push(`<span class="chip">${esc(v)}</span>`);else if(f.type==="date"&&f.k!=="d")parts.push(`<span class="chip">${f.k==="prazo"?"até ":""}${fdate(v)}</span>`);else if(f.type==="money")parts.push(`<span class="amt">${money(v)}</span>`);else if(f.type==="text"||!f.type){if(f.k!=="t")parts.push(`<span class="chip">${esc(v)}</span>`);}});
  const ta=L.fields.find(f=>f.type==="textarea"&&i[f.k]);return (parts.length?`<div class="meta">${parts.join("")}</div>`:"")+(ta?`<p>${esc(i[ta.k])}</p>`:"");}
function itemCard(k,i){const L=LISTS[k],done=L.check&&i[L.check];
  return `<div class="item">${L.check?`<button class="ck ${done?"on":""}" data-a="liCheck" data-k="${k}" data-id="${i.id}" aria-label="Concluir">${ic("check")}</button>`:""}<button class="ibody" data-a="liEdit" data-k="${k}" data-id="${i.id}"><b class="${done?"strike":""}">${esc(i.t||"Sem título")}</b>${(L.sub||autoSub.bind(null,L))(i)}</button></div>`;}
function listBody(k){const L=LISTS[k];let items=all(k);let h="";
  if(L.tabs){const tv=VIEW.tab||L.tabs.def();const ys=yearsOf(k,L.tabs.k,L.tabs.base());items=items.filter(i=>String(i[L.tabs.k])===String(tv));
    h+=`<div class="tabs">${ys.map(y=>`<button data-a="liTab" data-v="${y}" aria-pressed="${y===String(tv)}">${y}</button>`).join("")}<button data-a="liYear" data-k="${k}" aria-label="Adicionar ano">${ic("plus")} Ano</button></div>`;}
  if(L.top)h+=L.top(items);
  if(L.quick)h+=`<div class="qadd"><input id="qa" placeholder="${esc(L.quick.ph)}" data-enter="liQuick" data-k="${k}" aria-label="${esc(L.quick.ph)}"><button class="btn" data-a="liQuick" data-k="${k}" aria-label="Adicionar">${ic("plus")}</button></div>`;
  if(L.search){h+=`<div class="search">${ic("search")}<input id="lsq" placeholder="Buscar" value="${esc(VIEW.q||"")}" data-in="liSearch"></div>`;const q=(VIEW.q||"").toLowerCase();if(q)items=items.filter(i=>JSON.stringify(i).toLowerCase().includes(q));}
  items.sort(L.sort||((a,b)=>(a.feito?1:0)-(b.feito?1:0)||(b.u||0)-(a.u||0)));
  if(L.groupFixed){const F=L.groupFixed(),G=new Map(F.map(g=>[g,[]]));items.forEach(i=>{let g=L.group(i);if(!G.has(g))G.set(g,[]);G.get(g).push(i);});
    G.forEach((arr,g)=>{const bi=BLOCOS.find(b=>b[0]===g);h+=`<div class="grp blk">${bi?`<span class="mb" style="width:30px;height:30px;border-radius:9px;font-size:.9rem">${ic(bi[1])}</span>`:""}${esc(g)}<span class="chip">${arr.filter(i=>i[L.check]).length}/${arr.length}</span><button class="ib" style="width:32px;height:32px" data-a="liNew" data-k="${k}" data-area="${esc(g)}" aria-label="Nova meta em ${esc(g)}">${ic("plus")}</button></div>`+(arr.length?arr.map(i=>itemCard(k,i)).join(""):`<div class="note" style="margin:0 0 6px">Nenhuma meta no bloco ${esc(g.toLowerCase())}. Toque no + para criar.</div>`);});
    return h;}
  if(!items.length)return h+empty(k,VIEW.q?"Nada encontrado":L.emptyT,VIEW.q?"Tente outra palavra.":L.emptyX,VIEW.q?"":`<button class="btn sm" data-a="liNew" data-k="${k}">${ic("plus")} Adicionar</button>`);
  if(L.group){const G=new Map();items.forEach(i=>{const g=L.group(i);if(!G.has(g))G.set(g,[]);G.get(g).push(i);});let keys=[...G.keys()];
    if(L.groupOrder)keys.sort((a,b)=>L.groupOrder.indexOf(a)-L.groupOrder.indexOf(b));else if(L.groupDesc)keys.sort().reverse();else keys.sort();
    keys.forEach(g=>{const arr=G.get(g);h+=`<div class="grp">${esc(L.groupLabel?L.groupLabel(g):g)}<span class="chip">${arr.length}</span></div>`+arr.map(i=>itemCard(k,i)).join("");});}
  else h+=items.map(i=>itemCard(k,i)).join("");
  return h;}

function streakH(h){let d=TODAY();const D=h.dias||{};if(!D[d])d=addDays(d,-1);let n=0;while(D[d]){n++;d=addDays(d,-1);}return n;}
function pontos(){const g=sum(all("hab").map(h=>Object.keys(h.dias||{}).length*(+h.pts||10)));const s=sum(all("rec").map(r=>(r.resg||[]).length*(+r.custo||0)));return{g,s,saldo:g-s};}
VIEWS.habitos=()=>{const H=all("hab").sort((a,b)=>(a.o||0)-(b.o||0)),R=all("rec").sort((a,b)=>(a.custo||0)-(b.custo||0)),t=TODAY(),P=pontos();
  const days=[...Array(7)].map((_,i)=>addDays(t,i-6));const wk=sum(H.map(h=>days.filter(d=>h.dias&&h.dias[d]).length*(+h.pts||10)));
  let h=`<header class="top"><span class="mb">${ic("list-checks")}</span><h1>Hábitos</h1></header>
  <div class="hero"><div class="row"><div class="grow"><div class="muted small">Seus pontos para trocar</div><h2 style="font-size:2.4rem">${P.saldo} pts</h2><div class="muted small">+${wk} nesta semana · ${P.g} ganhos no total</div></div><span class="mb" style="width:56px;height:56px">${ic("trophy")}</span></div></div>`;
  if(!H.length)h+=`<div style="margin-top:14px">${empty("habitos","Crie seus hábitos","Cada check vale pontos. Junte pontos e troque por recompensas.")}</div><div class="grp">Sugestões rápidas</div><div class="wrap-row">${["Beber 2 L de água","Acordar às 5h30","Ler 10 páginas","Sem açúcar","Meditar 10 min","Dormir antes das 23h","Alongar 10 min"].map(s=>`<button class="chip m" style="padding:8px 12px" data-a="habSug" data-n="${esc(s)}">${ic("plus")} ${esc(s)}</button>`).join("")}</div>`;
  else{h+=`<div class="sec"><h2>Últimos 7 dias</h2></div><div class="card"><div class="hdays hhead2">${days.map(d=>`<div class="hd ${d===t?"td":""}">${DSEM[pd(d).getDay()]}<br>${+d.slice(8)}</div>`).join("")}</div>
    ${H.map(x=>`<div class="hrow"><button class="hn" data-a="habEdit" data-id="${x.id}">${esc(x.nome)} <small>${x.pts||10} pts${streakH(x)>1?" · "+streakH(x)+" dias seguidos":""}</small></button><div class="hdays">${days.map(d=>{const on=!!(x.dias&&x.dias[d]);return `<button class="hc ${on?"on":""}" data-a="habT" data-id="${x.id}" data-d="${d}" aria-label="${esc(x.nome)} em ${fdate(d)}">${ic("check")}</button>`;}).join("")}</div></div>`).join("")}</div>`;}
  h+=`<div class="sec"><h2>Recompensas</h2><button class="lk" data-a="recNew">${ic("plus")} Nova</button></div>`;
  h+=R.length?R.map(r=>{const p=clamp(P.saldo/(r.custo||1)*100,0,100),ok=P.saldo>=(r.custo||0);return `<div class="item rw"><span class="gift">${ic("gift")}</span><button class="ibody" data-a="recEdit" data-id="${r.id}"><b>${esc(r.nome)}</b><div class="meta"><span class="chip m">${r.custo} pts</span>${(r.resg||[]).length?`<span class="chip c">resgatada ${(r.resg||[]).length}x</span>`:""}</div><div class="bar"><i style="width:${p}%"></i></div></button><button class="btn sm" data-a="recGo" data-id="${r.id}" ${ok?"":"disabled"}>Resgatar</button></div>`;}).join("")
    :`<div class="wrap-row">${[["Pizza no fim de semana",100],["Comprar um livro novo",150],["Dia de folga total",300]].map(([n,c])=>`<button class="chip m" style="padding:8px 12px" data-a="recSug" data-n="${esc(n)}" data-c="${c}">${ic("plus")} ${esc(n)} · ${c} pts</button>`).join("")}</div>`;
  return `<div class="app">${h}</div>${fab("habNew","Novo hábito")}`;};
ACT.habT=el=>{const x=getD(el.dataset.id),d=el.dataset.d;x.dias=x.dias||{};if(x.dias[d])delete x.dias[d];else{x.dias[d]=1;toast("check","+"+(x.pts||10)+" pts",x.nome);}save(x);rr();};
ACT.habSug=el=>{save({id:"hab_"+nid(),c:"hab",nome:el.dataset.n,pts:10,o:Date.now(),dias:{}});rr();};
ACT.recSug=el=>{save({id:"rec_"+nid(),c:"rec",nome:el.dataset.n,custo:+el.dataset.c,resg:[]});rr();};
const HF=[{k:"nome",l:"Hábito",auto:1,ph:"Ex.: Beber 2 L de água"},{k:"pts",l:"Pontos por check",type:"number",def:10}];
function habForm(x){sheet(`<h2>${x?"Editar hábito":"Novo hábito"}</h2>${HF.map(f=>fieldHTML(f,x?x[f.k]:null)).join("")}${x?`<div class="note">${Object.keys(x.dias||{}).length} checks no total · sequência atual de ${streakH(x)} dias</div>`:""}
  <div class="btns"><button class="btn full" id="hS">${x?"Salvar":"Criar hábito"}</button>${x?`<button class="btn danger full" id="hX">Apagar hábito</button>`:""}</div>`,s=>{
  s.querySelector("#hS").onclick=()=>{const o=readFields(HF,s);if(!o.nome)return toast("triangle-alert","Dê um nome ao hábito","");o.pts=Math.max(1,Math.round(+o.pts||10));const d=x||{id:"hab_"+nid(),c:"hab",o:Date.now(),dias:{}};Object.assign(d,o);save(d);closeSheet();rr();};
  const xx=s.querySelector("#hX");if(xx)xx.onclick=()=>confirmSheet("Apagar este hábito?","Os pontos ganhos com ele também saem do saldo.","Apagar",()=>{removeDoc(x.id);rr();});});}
ACT.habNew=()=>habForm(null);ACT.habEdit=el=>habForm(getD(el.dataset.id));
const RF=[{k:"nome",l:"Recompensa",auto:1,ph:"Ex.: Jantar especial"},{k:"custo",l:"Custa quantos pontos",type:"number",def:100}];
function recForm(r){sheet(`<h2>${r?"Editar recompensa":"Nova recompensa"}</h2>${RF.map(f=>fieldHTML(f,r?r[f.k]:null)).join("")}
  <div class="btns"><button class="btn full" id="rS">${r?"Salvar":"Criar recompensa"}</button>${r&&(r.resg||[]).length?`<button class="btn ghost full" id="rU">Desfazer último resgate</button>`:""}${r?`<button class="btn danger full" id="rX">Apagar recompensa</button>`:""}</div>`,s=>{
  s.querySelector("#rS").onclick=()=>{const o=readFields(RF,s);if(!o.nome)return toast("triangle-alert","Dê um nome à recompensa","");o.custo=Math.max(1,Math.round(+o.custo||100));const d=r||{id:"rec_"+nid(),c:"rec",resg:[]};Object.assign(d,o);save(d);closeSheet();rr();};
  const u=s.querySelector("#rU");if(u)u.onclick=()=>{r.resg.pop();save(r);closeSheet();rr();};
  const x=s.querySelector("#rX");if(x)x.onclick=()=>{removeDoc(r.id);closeSheet();rr();};});}
ACT.recNew=()=>recForm(null);ACT.recEdit=el=>recForm(getD(el.dataset.id));
ACT.recGo=el=>{const r=getD(el.dataset.id);if(pontos().saldo<r.custo)return;r.resg=(r.resg||[]).concat(TODAY());save(r);rr();toast("party-popper","Recompensa liberada!","Aproveite: "+r.nome);};

ACT.hiitNew=()=>{const n=Math.max(0,...all("hiit").map(v=>v.n))+1;const d=save({id:"hiit_"+nid(),c:"hiit",n,t:"",link:"",ex:[]});go({v:"hiitv",id:d.id});};
VIEWS.hiitv=()=>{const v=getD(VIEW.id);if(!v){VIEW={v:"hiit"};return VIEWS.hiit();}const ex=v.ex||[];

  h+=`<div class="sec"><h2>Exercícios</h2></div>`;
  h+=ex.length?ex.map((e,i)=>`<div class="ex"><span class="n">${i+1}</span><button class="grow" style="text-align:left" data-a="exEdit" data-i="${i}"><b>${esc(e.t)}</b>${e.dur||e.obs?`<span class="small muted" style="display:block">${esc([e.dur,e.obs].filter(Boolean).join(" · "))}</span>`:""}</button><span class="mv"><button data-a="exMv" data-i="${i}" data-d="-1" aria-label="Subir" ${i?"":"disabled"}>${ic("chevron-up")}</button><button data-a="exMv" data-i="${i}" data-d="1" aria-label="Descer" ${i<ex.length-1?"":"disabled"}>${ic("chevron-down")}</button></span></div>`).join("")
    :`<div class="note">Nenhum exercício ainda. Digite abaixo e toque em + (ou Enter).</div>`;
  h+=`<div class="qadd" style="margin-top:12px"><input id="exN" placeholder="Exercício, ex.: Ginga + meia-lua de frente" data-enter="exAdd"><input id="exD" style="flex:0 0 96px" placeholder="40 s" data-enter="exAdd" aria-label="Duração ou repetições"><button class="btn" data-a="exAdd" aria-label="Adicionar exercício">${ic("plus")}</button></div>`;
  return `<div class="app">${h}</div>`;};
ACT.exAdd=()=>{const v=getD(VIEW.id),n=$("exN"),d=$("exD");const t=n.value.trim();if(!t)return n.focus();v.ex=(v.ex||[]).concat({t,dur:d.value.trim(),obs:""});save(v);rr();$("exN").focus();};
ACT.exMv=el=>{const v=getD(VIEW.id),i=+el.dataset.i,j=i+ +el.dataset.d;if(j<0||j>=v.ex.length)return;[v.ex[i],v.ex[j]]=[v.ex[j],v.ex[i]];save(v);rr();};
ACT.exEdit=el=>{const v=getD(VIEW.id),i=+el.dataset.i,e=v.ex[i];const F=[{k:"t",l:"Exercício"},{k:"dur",l:"Tempo ou repetições",ph:"Ex.: 40 s ou 15x"},{k:"obs",l:"Observação",type:"textarea"}];
  sheet(`<h2>Exercício ${i+1}</h2>${F.map(f=>fieldHTML(f,e[f.k])).join("")}<div class="btns"><button class="btn full" id="eS">Salvar</button><button class="btn danger full" id="eX">Remover exercício</button></div>`,s=>{
    s.querySelector("#eS").onclick=()=>{Object.assign(e,readFields(F,s));save(v);closeSheet();rr();};s.querySelector("#eX").onclick=()=>{v.ex.splice(i,1);save(v);closeSheet();rr();};});};
ACT.hiitEdit=()=>{const v=getD(VIEW.id);const F=[{k:"n",l:"Número do vídeo",type:"number"},{k:"t",l:"Título (opcional)",ph:"Ex.: Pernas e esquivas"},{k:"link",l:"Link do vídeo",ph:"https://…"}];
  sheet(`<h2>Vídeo ${v.n}</h2>${F.map(f=>fieldHTML(f,v[f.k])).join("")}<div class="btns"><button class="btn full" id="vS">Salvar</button><button class="btn danger full" id="vX">Apagar vídeo</button></div>`,s=>{
    s.querySelector("#vS").onclick=()=>{const o=readFields(F,s);o.n=Math.max(1,Math.round(+o.n||v.n));if(o.link&&!/^https?:\/\//i.test(o.link))o.link="https://"+o.link;Object.assign(v,o);save(v);closeSheet();rr();};
    s.querySelector("#vX").onclick=()=>confirmSheet("Apagar o Vídeo "+v.n+"?","Os exercícios dele também serão apagados.","Apagar vídeo",()=>{removeDoc(v.id);back();});});};

/* ================= EDITAIS DA CULTURA ================= */
const EST=[["c","Contemplado","#15803D"],["a","No aguardo do resultado","#B45309"],["n","Não contemplado","#B91C1C"]];
const estOf=k=>EST.find(e=>e[0]===k)||EST[1];
const ST_ORD={c:0,a:1,n:2};
const edAno=e=>String(e.ano||"2026");
const ganhoP=p=>p.st==="c"?(+p.val||0)*(+p.pct||0)/100:0;
const aprov=e=>(e.pess||[]).filter(p=>p.st==="c").length;
const ganhoE=e=>sum((e.pess||[]).map(ganhoP));
const recP=p=>p.st==="c"?Math.min(+p.rec||0,ganhoP(p)||+p.rec||0):0;
const recE=e=>sum((e.pess||[]).map(recP));
const faltaE=e=>Math.max(0,ganhoE(e)-recE(e));
const pctTxt=v=>(+v||0).toLocaleString("pt-BR",{maximumFractionDigits:2})+"%";
function anosEd(){const s=new Set(["2026","2027"]);all("ed").forEach(e=>s.add(edAno(e)));(single("yrs_ed",{l:[]}).l||[]).forEach(y=>s.add(String(y)));return[...s].sort();}
function edsDoAno(y){return all("ed").filter(e=>edAno(e)===y).sort((a,b)=>(a.o||0)-(b.o||0));}
/* tela 1: anos */
function edAnosView(){const Y=anosEd();const allE=all("ed");const tA=sum(allE.map(aprov)),tG=sum(allE.map(ganhoE));
  let h=topbar("Editais da cultura","editais");
  h+=`<div class="hero"><div class="muted small">Todas as aprovações</div><div class="row" style="align-items:flex-end;gap:18px;flex-wrap:wrap"><div><h2 style="font-size:2.2rem">${tA}</h2><div class="small muted">${tA===1?"edital aprovado":"editais aprovados"}</div></div>${tG?`<div><h2 style="font-size:1.6rem">${money(tG)}</h2><div class="small muted">ganho total</div></div><div><h2 style="font-size:1.6rem;color:var(--ok)">${money(sum(allE.map(recE)))}</h2><div class="small muted">já recebido</div></div><div><h2 style="font-size:1.6rem;color:var(--wait)">${money(sum(allE.map(faltaE)))}</h2><div class="small muted">falta receber</div></div>`:""}</div></div>`;
  h+=`<div class="sec"><h2>Anos</h2><button class="lk" data-a="edAnoNovo">${ic("plus")} Ano</button></div><div class="albums">${Y.map(y=>{const E=edsDoAno(y),a=sum(E.map(aprov)),g=sum(E.map(ganhoE));
    return `<button class="alb" data-a="go" data-v="${gv({v:"editais",ano:y})}"><div class="cv" style="flex-direction:column;gap:4px"><b style="font:800 2rem var(--disp);margin:0;color:var(--deep)">${y}</b><span style="color:var(--deep)">${ic("folder")}</span></div><b>Editais ${y}</b><span>${E.length} ${E.length===1?"edital":"editais"} · ${a} ${a===1?"aprovado":"aprovados"}${g?" · "+money(g):""}${sum(E.map(faltaE))?" · falta "+money(sum(E.map(faltaE))):""}</span></button>`;}).join("")}</div>`;
  return `<div class="app">${h}</div>`;}
ACT.edAnoNovo=()=>textEditOne("Novo ano","Ano","Ex.: 2028",v=>{const n=parseInt(v,10);if(!(n>1900&&n<2200))return toast("triangle-alert","Digite um ano válido","Ex.: 2028");const d=single("yrs_ed",{l:[]});if(!d.l.includes(n))d.l.push(n);save(d);rr();});
/* tela 2: quadro do ano */
VIEWS.editais=()=>{if(!VIEW.ano)return edAnosView();const y=VIEW.ano,E=edsDoAno(y);const ci=Math.min(VIEW.ci||0,E.length);
  const tA=sum(E.map(aprov)),tG=sum(E.map(ganhoE));
  let h=topbar("Editais "+y,"editais");
  h+=`<div class="edsum"><div class="hero" style="padding:14px 18px"><div class="edst"><div><div class="muted small">Aprovados em ${y}</div><h2>${tA}</h2></div><div><div class="muted small">Ganho total em ${y}</div><h2>${money(tG)}</h2></div><div><div class="muted small">Já recebido</div><h2 style="color:var(--ok)">${money(sum(E.map(recE)))}</h2></div><div><div class="muted small">Falta receber</div><h2 style="color:var(--wait)">${money(sum(E.map(faltaE)))}</h2></div></div></div>
   <div class="note" style="margin:0">${ic("arrow-right-left")} Segure o título de um edital para mudar a ordem. Toque numa pessoa aprovada para informar o valor e a sua porcentagem.</div></div>`;
  h+=`<div class="board" id="board">${E.map(e=>{const P=(e.pess||[]).map((p,i)=>({p,i})).sort((a,b)=>(ST_ORD[a.p.st]??1)-(ST_ORD[b.p.st]??1)||a.i-b.i);const g=ganhoE(e);
    return `<section class="col" data-id="${e.id}" aria-label="${esc(e.nome)}"><div class="colh"><span class="grip" aria-hidden="true">${ic("grip-vertical")}</span><div class="grow"><h3>${esc(e.nome)}</h3>${e.info?`<div class="small muted">${esc(e.info)}</div>`:""}</div><button class="ib" data-a="edMenu" data-id="${e.id}" aria-label="Opções do edital">${ic("ellipsis-vertical")}</button></div>
     <div class="wrap-row"><span class="chip c">${ic("trophy")} Aprovados: ${aprov(e)}</span>${g?`<span class="chip c">${money(g)}</span>`:""}${faltaE(e)?`<span class="chip a">falta ${money(faltaE(e))}</span>`:g?`<span class="chip c">${ic("check")} tudo recebido</span>`:""}${edNotasCount(e.id)?`<button class="chip m" data-a="ednOpen" data-ed="${e.id}">${ic("notebook-pen")} ${edNotasCount(e.id)}</button>`:""}</div>
     ${P.map(({p,i})=>{const s=estOf(p.st);const gp=ganhoP(p);return `<button class="pp ${s[0]}" data-a="ppOpen" data-id="${e.id}" data-i="${i}"><span class="grow"><span style="display:block">${esc(p.n)}</span>${s[0]==="c"?`<small class="ppv">${p.val?`${money(p.val)} × ${pctTxt(p.pct)} = <b>${money(gp)}</b>`:"Toque para informar valor e %"}</small>${gp?`<small class="ppr ${recP(p)>=gp?"ok":""}">${recP(p)>=gp?"✓ Recebido":recP(p)>0?`Recebido ${money(recP(p))} · falta ${money(gp-recP(p))}`:`A receber ${money(gp)}`}</small>`:""}`:""}</span><span class="chip ${s[0]}">${s[0]==="c"?"1. Contemplado":s[0]==="a"?"2. Aguardando":"3. Não"}</span></button>`;}).join("")}
     <div class="qadd" style="margin:4px 0 0"><input id="pa_${e.id}" placeholder="Adicionar pessoa" data-enter="ppAdd" data-id="${e.id}" aria-label="Nome da pessoa"><button class="btn sm" data-a="ppAdd" data-id="${e.id}" aria-label="Adicionar pessoa">${ic("plus")}</button></div></section>`;}).join("")}
   <button class="col new" data-a="edNew"><span class="mb">${ic("plus")}</span>Novo edital em ${y}</button></div>
   <div class="dotsnav" id="bdots">${E.map((_,i)=>`<i class="${i===ci?"on":""}"></i>`).join("")}<i class="${ci===E.length?"on":""}"></i></div>`;
  after(()=>{const b=$("board");if(!b)return;const cols=qa(".col",b);b.addEventListener("scroll",()=>{const x=b.scrollLeft+b.clientWidth/2;let best=0,bd=1e9;cols.forEach((c,i)=>{const m=c.offsetLeft+c.offsetWidth/2;const dd=Math.abs(m-x);if(dd<bd){bd=dd;best=i;}});VIEW.ci=best;qa("#bdots i").forEach((d,i)=>d.classList.toggle("on",i===best));},{passive:true});enableBoardSort(b);});
  const nn=edNotas(y).filter(n=>!n.feito).length;
  return `<div class="app wide">${h}</div><button class="ednbar" data-a="ednOpen">${ic("notebook-pen")} Notas dos editais${nn?`<span class="ednct">${nn}</span>`:""}<span class="tiny" style="margin-left:auto;opacity:.75">pendências, prestação de contas…</span></button>`;};
ACT.edNew=()=>edForm(null);
function edForm(e){const F=[{k:"nome",l:"Nome do edital",auto:1,ph:"Ex.: Lei Paulo Gustavo 2026"},{k:"info",l:"Informação curta",ph:"Ex.: Resultado sai em março"}];
  sheet(`<h2>${e?"Editar edital":"Novo edital"}</h2>${F.map(f=>fieldHTML(f,e?e[f.k]:null)).join("")}<div class="btns"><button class="btn full" id="eS">${e?"Salvar":"Criar edital"}</button></div>`,s=>{
   s.querySelector("#eS").onclick=()=>{const o=readFields(F,s);if(!o.nome)return toast("triangle-alert","Dê um nome ao edital","");const d=e||{id:"ed_"+nid(),c:"ed",o:Date.now(),ano:VIEW.ano||"2026",pess:[]};Object.assign(d,o);save(d);closeSheet();
     if(!e){const n=edsDoAno(d.ano).length-1;VIEW.ci=n;rr();const b=$("board");if(b){const c=qa(".col",b)[n];if(c)b.scrollLeft=c.offsetLeft-16;}}else rr();};});}
ACT.edMenu=el=>{const e=getD(el.dataset.id);const E=edsDoAno(edAno(e)),i=E.indexOf(e);

/* ================= LEMBRETES ================= */
const REP=[["","Não repete"],["d","Todo dia"],["w","Toda semana"],["m","Todo mês"],["y","Todo ano"]];
const dtOf=(d,h)=>{const x=pd(d);const[a,b]=(h||"09:00").split(":").map(Number);x.setHours(a,b,0,0);return x;};
function stepOcc(dt,rep,n){const x=new Date(dt);if(rep==="d")x.setDate(x.getDate()+n);else if(rep==="w")x.setDate(x.getDate()+7*n);else if(rep==="m")x.setMonth(x.getMonth()+n);else if(rep==="y")x.setFullYear(x.getFullYear()+n);return x;}
function lastOcc(r,now){const b=dtOf(r.d,r.h);if(b>now)return null;if(!r.rep)return b;let n=0;if(r.rep==="d")n=Math.floor((now-b)/864e5);else if(r.rep==="w")n=Math.floor((now-b)/(7*864e5));
  let x=stepOcc(b,r.rep,n);while(stepOcc(b,r.rep,n+1)<=now){n++;x=stepOcc(b,r.rep,n);}while(x>now&&n>0){n--;x=stepOcc(b,r.rep,n);}return x;}
function nextOcc(r,now){const b=dtOf(r.d,r.h);if(b>now||!r.rep)return b;const l=lastOcc(r,now);let n=1,x=stepOcc(l,r.rep,1);return x;}
function upcomingRems(){const now=new Date();return all("rem").filter(r=>!r.feito).map(r=>({r,w:nextOcc(r,now)})).sort((a,b)=>a.w-b.w).map(x=>x.r);}
function whenTxt(w){const d=iso(w);return flong(d)+" às "+pad(w.getHours())+":"+pad(w.getMinutes());}
function remCard(r){const now=new Date(),w=nextOcc(r,now),late=!r.rep&&w<=now&&!r.feito;
  return `<div class="item"><button class="ck ${r.feito?"on":""}" data-a="remDone" data-id="${r.id}" aria-label="Concluir lembrete">${ic("check")}</button><button class="ibody" data-a="remEdit" data-id="${r.id}"><b class="${r.feito?"strike":""}">${esc(r.t)}</b><div class="meta"><span class="chip ${late?"n":"m"}">${ic(late?"circle-alert":"clock")} ${esc(whenTxt(w))}</span>${r.rep?`<span class="chip">${ic("refresh-cw")} ${esc(REP.find(x=>x[0]===r.rep)[1])}</span>`:""}</div>${r.nota?`<p>${esc(r.nota)}</p>`:""}</button></div>`;}
VIEWS.lemb=()=>{const now=new Date(),A=all("rem");const late=A.filter(r=>!r.feito&&!r.rep&&dtOf(r.d,r.h)<=now).sort((a,b)=>dtOf(a.d,a.h)-dtOf(b.d,b.h));
  const up=A.filter(r=>!r.feito&&!late.includes(r)).sort((a,b)=>nextOcc(a,now)-nextOcc(b,now)),fe=A.filter(r=>r.feito).sort((a,b)=>(b.u||0)-(a.u||0)).slice(0,20);
  let h=`<header class="top"><span class="mb">${ic("alarm-clock")}</span><h1>Lembretes</h1></header>`;
  if(!notifOK())h+=`<div class="note row">${ic("bell")}<span class="grow">Ative as notificações para o celular avisar na hora certa.</span><button class="btn sm" data-a="notif">Ativar</button></div>`;
  h+=`<div class="qadd"><input id="rq" placeholder="Ex.: Cortar o cabelo" data-enter="remQuick" aria-label="Novo lembrete"><button class="btn" data-a="remQuick" aria-label="Criar lembrete">${ic("plus")}</button></div>`;
  if(!A.length)h+=empty("lemb","Nada para lembrar ainda","Escreva algo como “cortar o cabelo”, escolha o dia e a hora, e o app avisa você.");
  if(late.length)h+=`<div class="grp">Atrasados<span class="chip n">${late.length}</span></div>`+late.map(remCard).join("");
  if(up.length)h+=`<div class="grp">Próximos<span class="chip">${up.length}</span></div>`+up.map(remCard).join("");
  if(fe.length)h+=`<div class="grp">Concluídos</div>`+fe.map(remCard).join("");
  return `<div class="app">${h}</div>${fab("remNew","Novo lembrete")}`;};
const RMF=[{k:"t",l:"Lembrar de",auto:1,ph:"Ex.: Cortar o cabelo"},{k:"d",l:"Dia",type:"date",def:TODAY},{k:"h",l:"Hora",type:"time",def:()=>pad(Math.min(23,new Date().getHours()+1))+":00"},{k:"rep",l:"Repetir",type:"select",opts:REP,def:""},{k:"nota",l:"Detalhes",type:"textarea"}];
